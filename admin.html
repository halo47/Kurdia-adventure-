:root{

.app{height:100vh;display:flex;flex-direction:column}

.topbar{
  height:64px;
  flex:none;
  background:#0a0f17;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{

  height:38px;

  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
}

.brand-title{font-weight:900;letter-spacing:.05em}
.brand-sub{font-size:9px;color:#727d90;letter-spacing:.2em}

.top-actions{display:flex;align-items:center;gap:7px}

.icon-btn{

  height:40px;
  border-radius:11px;
  background:#111823;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c8ced8;
}

.icon-btn:hover{background:#182130;color:#fff}

.primary-btn{
  background:var(--red);
  border:0;
  border-radius:11px;
  padding:10px 16px;
  font-weight:800;
  color:#fff;
}

.primary-btn:hover{background:#b4223c}

.layout{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:260px minmax(0,1fr) 330px;
}

.sidebar{
  background:#0b111a;
  border-left:1px solid var(--border);
  min-height:0;
  overflow:auto;
  padding:14px;
}

.main{
  min-width:0;
  min-height:0;
  overflow:auto;
  background:
    radial-gradient(circle at 30% 0%,rgba(157,28,50,.09),transparent 30%),
    #080c13;
}

.inspector{
  background:#0b111a;
  border-right:1px solid var(--border);
  min-height:0;
  overflow:auto;
  padding:14px;
}

.panel-title{
  font-size:12px;
  font-weight:800;
  color:#9da7b7;
  margin:5px 3px 10px;
}

.section-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.section-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px;
  border-radius:12px;
  background:#101722;
  border:1px solid transparent;
  transition:.2s;
}

.section-item:hover{
  background:#151e2b;
}

.section-item.active{
  border-color:rgba(157,28,50,.7);
  background:rgba(157,28,50,.12);
}

.drag-handle{
  color:#657084;
  cursor:grab;
}

.section-info{
  flex:1;
  min-width:0;
}

.section-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.section-type{
  font-size:9px;
  color:#687487;
  margin-top:2px;
}

.eye-btn{
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#738096;
}

.eye-btn.hidden-section{color:#c23a52}

.workspace{
  padding:18px;
  min-height:100%;
}

.workspace-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.workspace-title{
  font-size:20px;
  font-weight:900;
}

.workspace-sub{
  font-size:11px;
  color:#707b8e;
  margin-top:4px;
}

.device-switch{
  display:flex;
  background:#0d131d;
  border:1px solid var(--border);
  border-radius:12px;
  padding:4px;
  gap:3px;
}

.device-switch button{
  width:38px;
  height:34px;
  border-radius:8px;
  background:transparent;
  color:#788398;
}

.device-switch button.active{
  background:#1a2331;
  color:#fff;
}

.preview-shell{
  background:#111722;
  border:1px solid var(--border);
  border-radius:18px;
  min-height:650px;
  overflow:hidden;
  position:relative;
}

.preview-toolbar{
  height:43px;
  background:#0d131d;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.preview-url{
  color:#657084;
  font-size:10px;
}

.preview-area{
  min-height:607px;
  background:#05070b;

  justify-content:center;
  align-items:flex-start;
  overflow:auto;
  padding:15px;
}

#previewFrame{
  border:0;
  background:#080b12;
  width:100%;
  min-height:720px;
  transition:.25s;
  box-shadow:0 15px 60px rgba(0,0,0,.4);
}

.form-card{
  background:#101722;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-bottom:10px;
}

.form-title{
  font-size:12px;
  font-weight:900;
  margin-bottom:11px;
  display:flex;
  align-items:center;
  gap:7px;
}

.field{
  margin-bottom:10px;
}

.field label{
  display:block;
  color:#9ba5b5;
  font-size:10px;
  font-weight:700;
  margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#080d15;
  border:1px solid rgba(255,255,255,.08);
  color:#fff;
  border-radius:10px;
  padding:10px;
  outline:none;
  font-size:12px;
}

.field textarea{
  min-height:82px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:rgba(157,28,50,.8);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.small-btn{
  border:1px solid var(--border);
  background:#121a26;
  color:#d4d9e2;
  border-radius:9px;
  padding:8px 10px;
  font-size:10px;
  font-weight:700;
}

.small-btn:hover{background:#1a2433}

.danger-btn{
  background:rgba(190,35,60,.1);
  color:#f07187;
  border:1px solid rgba(190,35,60,.3);
}

.success-btn{
  background:rgba(37,160,98,.1);
  color:#66d7a0;
  border:1px solid rgba(37,160,98,.25);
}

.array-item{
  display:flex;
  gap:6px;
  margin-bottom:6px;
}

.array-item input{
  flex:1;
}

.image-preview{
  width:100%;
  height:120px;
  border-radius:10px;
  object-fit:cover;
  background:#080d15;
  border:1px solid var(--border);
  margin-bottom:8px;
}

.color-row{

  gap:8px;
  align-items:center;
}

.color-row input[type=color]{

  height:40px;

  border-radius:9px;
  border:1px solid var(--border);
  background:#080d15;
}

.empty{
  padding:30px 12px;
  text-align:center;
  color:#677286;
  font-size:11px;
}

.toast{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:9999;
  background:#151d2a;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 15px;
  font-size:11px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  transform:translateY(100px);
  opacity:0;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.72);

  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-backdrop.show{display:flex}

.modal{

.login-screen{

.login-box{

.login-logo{

.login-box input{

  border-radius:12px;
  padding:13px;
  color:#fff;
  text-align:center;
  letter-spacing:.3em;
  outline:none;
}

.login-box button{
  width:100%;
  margin-top:10px;
}

.tabbar{
  display:flex;
  gap:5px;
  overflow:auto;
  margin-bottom:12px;
}

.tabbar button{
  flex:none;
  padding:8px 11px;

  color:#8d98aa;

.tabbar button.active{

.status{

.mobile-menu-btn{display:none}

  .preview-area{min-height:550px;padding:7px}
  #previewFrame{min-height:650px}
  .row{grid-template-columns:1fr}
}

/* =========================================================
   HELPERS
========================================================= */

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}


function mergeData(base, extra){

  const result = {
    ...clone(base),
    ...(extra || {})
  };

  if(!Array.isArray(result.sections)){
    result.sections = clone(DEFAULT_DATA.sections);
  }

  if(!Array.isArray(result.services)){
    result.services = clone(DEFAULT_DATA.services);
  }

  if(!Array.isArray(result.gallery)){
    result.gallery = [];
  }

  return result;
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function uid(prefix="section"){

  return prefix + "_" +
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,7);

}


function showToast(message){

  const el = document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);

}

/* =========================================================
   LOAD
========================================================= */

function loadState(){

  try{

    const published =
      localStorage.getItem(STORAGE_PUBLISHED);

    const draft =
      localStorage.getItem(STORAGE_DRAFT);

    if(draft){

      siteData =
        mergeData(
          DEFAULT_DATA,
          JSON.parse(draft)
        );

    }else if(published){

      siteData =
        mergeData(
          DEFAULT_DATA,
          JSON.parse(published)
        );

    }else{

      siteData =
        clone(DEFAULT_DATA);

    }

  }catch(error){

    console.error(error);

    siteData =
      clone(DEFAULT_DATA);

  }

}


/* =========================================================
   HISTORY
========================================================= */

function snapshot(){

  undoStack.push(clone(siteData));

  if(undoStack.length > 50){
    undoStack.shift();
  }

  redoStack=[];

}


function undo(){

  if(!undoStack.length){

    showToast("هیچ گۆڕانکارییەکی تر نییە");

    return;
  }

  redoStack.push(clone(siteData));

  siteData =
    undoStack.pop();

  saveDraft(false);

  renderAll();

}


function redo(){

  if(!redoStack.length){

    showToast("هیچ گۆڕانکارییەکی تر نییە");

    return;
  }

  undoStack.push(clone(siteData));

  siteData =
    redoStack.pop();

  saveDraft(false);

  renderAll();

}

   SAVE DRAFT
========================================================= */

function toggleSection(id){

    siteData.sections.find(

  section.visible =
    section.visible === false;

  renderAll();

      ? "بەشەکە پیشان درا"
      : "بەشەکە شاردرایەوە"
  );

}


/* =========================================================
   DRAG DROP
========================================================= */

let dragId=null;


function dragStart(event,id){

  dragId=id;

  event.dataTransfer.effectAllowed="move";

}


function dragOver(event){

  event.preventDefault();

  event.dataTransfer.dropEffect="move";

}


function dropSection(event,targetId){

  event.preventDefault();

  if(!dragId || dragId===targetId) return;

  const from =
    siteData.sections.findIndex(
      s => s.id===dragId
    );

  const to =
    siteData.sections.findIndex(
      s => s.id===targetId
    );

  if(from<0 || to<0) return;

  snapshot();

  const item =
    siteData.sections.splice(from,1)[0];

  siteData.sections.splice(to,0,item);

  saveDraft(false);

  renderAll();

  showToast("ڕیزبەندی نوێ کرایەوە");

  dragId=null;

}

function deleteSelectedSection(){

    return;

  }

  const section =
    siteData.sections.find(
      s => s.id===selectedSectionId
    );

  if(!section) return;

  const ok =
    confirm(
      `دڵنیایت لە سڕینەوەی "${section.title}"؟`

  snapshot();

  siteData.sections =
    siteData.sections.filter(
      s => s.id!==selectedSectionId

  selectedSectionId=null;

  saveDraft(false);

  renderAll();

  showToast("بەشەکە سڕایەوە");

      accept="image/*"
      style="display:none"
      onchange="handleSingleImage(event,'${key}')"
    >

  </label>

</div>

`;

}

/* =========================================================
UPDATE DATA
========================================================= */

function updateData(key,value){

if(
key.startsWith("_custom")
){

updateCustomField(
  key,
  value
);

return;

}

snapshot();

siteData[key]=value;

saveDraft(false);

renderPreview();

}

function updateCustomField(key,value){

const section =
getSelectedSection();

if(!section) return;

snapshot();

if(key==="__custom_heading"){
section.heading=value;
}

if(key==="__custom_text"){
section.text=value;
}

if(key==="__custom_image"){
section.image=value;
}

if(key==="__custom_buttonText"){
section.buttonText=value;
}

if(key==="__custom_buttonUrl"){
section.buttonUrl=value;
}

saveDraft(false);

renderPreview();

}

/* =========================================================
SECTION TITLE
========================================================= */

function updateSectionTitle(value){

const section =
getSelectedSection();

if(!section) return;

snapshot();

section.title=value;

saveDraft(false);

renderSectionList();

}

/* =========================================================
SECTION VISIBLE
========================================================= */

function setSectionVisible(value){

const section =
getSelectedSection();

if(!section) return;

snapshot();

section.visible=value;

saveDraft(false);

renderSectionList();

renderPreview();

}

/* =========================================================
GET SELECTED
========================================================= */

function getSelectedSection(){

return siteData.sections.find(
s => s.id===selectedSectionId
);

}

/* =========================================================
ARRAY
========================================================= */

function updateArrayItem(array,index,value){

snapshot();

siteData[array][index]=value;

saveDraft(false);

renderPreview();

}

function addArrayItem(array){

snapshot();

siteData[array].push("");

saveDraft(false);

renderInspector();

renderPreview();

}

function removeArrayItem(array,index){

snapshot();

siteData[array].splice(index,1);

saveDraft(false);

renderInspector();

renderPreview();

}

/* =========================================================
FAQ
========================================================= */

function updateFAQ(index,key,value){

const section =
getSelectedSection();

if(!section) return;

if(!Array.isArray(section.items)){
section.items=[];
}

snapshot();

section.items[index][key]=value;

saveDraft(false);

renderPreview();

}

function addFAQ(){

const section =
getSelectedSection();

if(!section) return;

snapshot();

if(!Array.isArray(section.items)){
section.items=[];
}

section.items.push({
question:"پرسیاری نوێ",
answer:"وەڵامی پرسیار"
});

saveDraft(false);

renderInspector();

renderPreview();

}

function removeFAQ(index){

const section =
getSelectedSection();

if(!section) return;

snapshot();

section.items.splice(index,1);

saveDraft(false);

renderInspector();

renderPreview();

}

/* =========================================================
IMAGE UPLOAD
========================================================= */

function fileToDataURL(file){

return new Promise((resolve,reject)=>{

const reader =
  new FileReader();

reader.onload =
  () => resolve(reader.result);

reader.onerror =
  reject;

reader.readAsDataURL(file);

});

}

async function handleSingleImage(event,key){

const file =
event.target.files[0];

if(!file) return;

try{

const data =
  await fileToDataURL(file);

snapshot();

if(key==="__custom_image"){

  const section =
    getSelectedSection();

  if(section){
    section.image=data;
  }

}else{

  siteData[key]=data;

}

saveDraft(false);

renderInspector();

renderPreview();

showToast("وێنە زیاد کرا");

}catch(error){

console.error(error);

showToast("کێشە لە خوێندنەوەی وێنە");

}

}

async function handleGalleryUpload(event){

const file =
event.target.files[0];

if(!file) return;

try{

const data =
  await fileToDataURL(file);

snapshot();

siteData.gallery.push(data);

saveDraft(false);

renderInspector();

renderPreview();

showToast("وێنە زیاد کرا");

}catch(error){

console.error(error);

}

}

/* =========================================================
PREVIEW
========================================================= */

function renderPreview(){

sendStateToPreview();

}

function sendStateToPreview(){

const frame =
document.getElementById("previewFrame");

if(!frame || !frame.contentWindow) return;

frame.contentWindow.postMessage(
{
type:"KURDIA_BUILDER_STATE",
state:clone(siteData)
},
"*"
);

}

window.addEventListener(
"message",
event=>{

if(
  event.data &&
  event.data.type ===
  "REQUEST_KURDIA_STATE"
){

  sendStateToPreview();

}

}
);

function reloadPreview(){

const frame =
document.getElementById("previewFrame");

frame.src="index.html?" + Date.now();

setTimeout(
sendStateToPreview,
700
);

}

/* =========================================================
DEVICE
========================================================= */

function setDevice(device){

currentDevice=device;

document
.querySelectorAll(".device-switch button")
.forEach(btn=>btn.classList.remove("active"));

document
.getElementById(
"device" +
device.charAt(0).toUpperCase() +
device.slice(1)
)
.classList.add("active");

const frame =
document.getElementById("previewFrame");

if(device==="desktop"){

frame.style.width="100%";

}

if(device==="tablet"){

frame.style.width="768px";
frame.style.maxWidth="100%";

}

if(device==="mobile"){

frame.style.width="390px";
frame.style.maxWidth="100%";

}

}

/* =========================================================
EXPORT
========================================================= */

function exportData(){

const blob =
new Blob(
[
JSON.stringify(
siteData,
null,
2
)
],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download=
"kurdia-site-data.json";

a.click();

URL.revokeObjectURL(url);

showToast("Data هەناردرا");

}

/* =========================================================
IMPORT
========================================================= */

function openImportModal(){

document
.getElementById("importModal")
.classList.add("show");

}

function importData(){

const text =
document
.getElementById("importTextarea")
.value
.trim();

if(!text){

showToast("Data بنووسە");

return;

}

try{

const parsed =
  JSON.parse(text);

snapshot();

siteData =
  mergeData(
    DEFAULT_DATA,
    parsed
  );

saveDraft(false);

closeModal("importModal");

renderAll();

showToast("Import سەرکەوتوو بوو");

}catch(error){

showToast("JSON ـەکە دروست نییە");

}

}

/* =========================================================
RESET
========================================================= */

function resetAll(){

const ok =
confirm(
"دڵنیایت؟ هەموو گۆڕانکارییەکانی ئەم browser ـە دەگەڕێنەوە بۆ default."
);

if(!ok) return;

snapshot();

siteData =
clone(DEFAULT_DATA);

localStorage.removeItem(
STORAGE_DRAFT
);

localStorage.removeItem(
STORAGE_PUBLISHED
);

selectedSectionId=null;

renderAll();

showToast("گەڕێندرایەوە بۆ Default");

}

/* =========================================================
MODAL
========================================================= */

function closeModal(id){

document
.getElementById(id)
.classList.remove("show");

}

SIDEBAR / INSPECTOR MOBILE
========================================================= */

function toggleSidebar(){

document
.getElementById("sidebar")
.classList.toggle("open");

}

function toggleInspector(){

document
.getElementById("inspector")
.classList.toggle("open");

}

/* =========================================================
PUBLIC SITE
========================================================= */

function openPublicSite(){

window.open(
"index.html",
"_blank"
);

}

/* =========================================================
KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
"keydown",
event=>{

if(
  (event.ctrlKey || event.metaKey) &&
  event.key.toLowerCase()==="z"
){

  event.preventDefault();

  if(event.shiftKey){
    redo();
  }else{
    undo();
  }

}

if(
  (event.ctrlKey || event.metaKey) &&
  event.key.toLowerCase()==="s"
){

  event.preventDefault();

  publish();

}

}
);

/* =========================================================
CLOSE SIDE PANELS WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
"click",
event=>{

if(window.innerWidth > 1100) return;

const sidebar =
  document.getElementById("sidebar");

const inspector =
  document.getElementById("inspector");

const target =
  event.target;

if(
  sidebar.classList.contains("open") &&
  !sidebar.contains(target) &&
  !target.closest(".mobile-menu-btn")
){

  sidebar.classList.remove("open");

}

}
);

/* =========================================================
ICONS
========================================================= */

if(window.lucide){
lucide.createIcons();
}
