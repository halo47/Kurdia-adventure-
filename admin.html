<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>KURDIA ADVENTURE — SMART WEBSITE BUILDER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100%;
      font-family: "Vazirmatn", sans-serif;
      background: #080b12; color: #f5f5f5; overflow: hidden;
    }
    button, input, textarea, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #0c1019; }
    ::-webkit-scrollbar-thumb { background: #303847; border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a5568; }
    .glass { background: rgba(17, 23, 35, 0.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.07); }
    .panel { background: #111722; border: 1px solid #202938; border-radius: 16px; }
    .input { width: 100%; background: #0b1019; border: 1px solid #293241; border-radius: 10px; color: #fff; padding: 10px 12px; outline: none; transition: .2s; }
    .input:focus { border-color: #9d1c32; box-shadow: 0 0 0 3px rgba(157,28,50,.12); }
    textarea.input { resize: vertical; min-height: 90px; }
    .btn { border: 1px solid #293241; background: #151c29; color: #fff; border-radius: 10px; padding: 9px 13px; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    .btn:hover { background: #1c2635; border-color: #3b4658; }
    .btn-primary { background: #9d1c32; border-color: #9d1c32; }
    .btn-primary:hover { background: #b3223b; border-color: #b3223b; }
    .btn-danger { background: #35131b; border-color: #63202d; color: #ff9baa; }
    .btn-success { background: #123026; border-color: #205842; color: #8ff0bd; }
    .sidebar-item { width: 100%; border: 0; background: transparent; color: #8e99aa; padding: 11px 13px; border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: right; transition: .2s; }
    .sidebar-item:hover { background: #151d2a; color: #fff; }
    .sidebar-item.active { background: rgba(157,28,50,.16); color: #ffb7c2; }
    .section-row { background: #0d131d; border: 1px solid #202938; border-radius: 11px; padding: 9px; cursor: grab; transition: .2s; }
    .section-row:hover { border-color: #394557; transform: translateY(-1px); }
    .section-row.selected { border-color: #9d1c32; box-shadow: 0 0 0 1px rgba(157,28,50,.25); }
    .section-row.hidden-section { opacity: .45; }
    .dragging { opacity: .4; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #43d17c; box-shadow: 0 0 10px rgba(67,209,124,.6); }
    .viewport-frame { transition: width .3s ease; height: calc(100vh - 76px); background: #080b12; box-shadow: 0 0 60px rgba(0,0,0,.35); }
    .viewport-desktop { width: 100%; }
    .viewport-tablet { width: 820px; max-width: 100%; }
    .viewport-mobile { width: 390px; max-width: 100%; }
    .toast { position: fixed; bottom: 24px; left: 24px; z-index: 99999; min-width: 250px; padding: 13px 17px; border-radius: 12px; background: #171e2b; border: 1px solid #303a4b; box-shadow: 0 15px 50px rgba(0,0,0,.4); transform: translateY(30px); opacity: 0; pointer-events: none; transition: .25s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.show { display: flex; }
    .modal { width: min(700px, 100%); max-height: 90vh; overflow: auto; background: #111722; border: 1px solid #293241; border-radius: 20px; box-shadow: 0 30px 100px rgba(0,0,0,.55); }
    .color-input { width: 44px; height: 40px; padding: 2px; background: #0b1019; border: 1px solid #293241; border-radius: 8px; cursor: pointer; }
    .login-bg { background: radial-gradient(circle at 15% 20%, rgba(157,28,50,.22), transparent 30%), radial-gradient(circle at 85% 80%, rgba(127,29,29,.18), transparent 30%), #070a10; }
    .login-card { background: rgba(15,20,30,.92); border: 1px solid #252e3d; box-shadow: 0 30px 100px rgba(0,0,0,.55); backdrop-filter: blur(20px); }
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 9px; font-size: 11px; background: #1a202c; color: #9ba6b7; border: 1px solid #293241; }
    @media (max-width: 900px) {
      .desktop-sidebar { display: none; }
      .mobile-sidebar { display: block !important; }
      .viewport-tablet, .viewport-mobile { width: 100%; }
    }
    .mobile-sidebar { display: none; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 z-[10000] login-bg flex items-center justify-center p-5">
  <div class="login-card w-full max-w-md rounded-3xl p-8">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-[#9d1c32] flex items-center justify-center shadow-2xl shadow-red-950/40 mb-5">
        <i data-lucide="mountain" class="w-10 h-10"></i>
      </div>
      <h1 class="text-2xl font-black">KURDIA ADVENTURE</h1>
      <p class="text-gray-500 mt-2">SMART WEBSITE BUILDER</p>
    </div>
    <form id="loginForm">
      <label class="block text-sm text-gray-400 mb-2">وشەی نهێنی</label>
      <input id="pinInput" type="password" class="input text-center text-xl tracking-[.4em]" placeholder="••••" autocomplete="off">
      <button type="submit" class="btn btn-primary w-full mt-4 py-3 font-bold">
        <i data-lucide="log-in" class="w-5 h-5"></i>
        چوونەژوورەوە
      </button>
      <p id="loginError" class="hidden text-red-400 text-sm text-center mt-4">وشەی نهێنی هەڵەیە</p>
    </form>
    <div class="text-center mt-7 text-xs text-gray-600">KURDIA ADVENTURE © 2026</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden h-screen overflow-hidden">
  <header class="h-[76px] border-b border-[#202938] bg-[#0d121b]/95 backdrop-blur-xl flex items-center justify-between px-4 md:px-6 relative z-50">
    <div class="flex items-center gap-3">
      <button id="mobileMenuBtn" class="btn md:hidden" onclick="toggleMobileSidebar()">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="w-10 h-10 rounded-xl bg-[#9d1c32] flex items-center justify-center">
        <i data-lucide="mountain" class="w-5 h-5"></i>
      </div>
      <div class="hidden sm:block">
        <div class="font-black text-sm">KURDIA BUILDER</div>
        <div class="text-[10px] text-gray-500">SMART WEBSITE BUILDER</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button class="btn hidden sm:inline-flex" onclick="undoState()" title="Undo"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
      <button class="btn hidden sm:inline-flex" onclick="redoState()" title="Redo"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
      <div class="hidden md:flex items-center gap-1 bg-[#090e16] rounded-xl p-1 border border-[#202938]">
        <button class="btn border-0" id="desktopBtn" onclick="setViewport('desktop')"><i data-lucide="monitor" class="w-4 h-4"></i></button>
        <button class="btn border-0" id="tabletBtn" onclick="setViewport('tablet')"><i data-lucide="tablet" class="w-4 h-4"></i></button>
        <button class="btn border-0" id="mobileBtn" onclick="setViewport('mobile')"><i data-lucide="smartphone" class="w-4 h-4"></i></button>
      </div>
      <a href="index.html" target="_blank" class="btn hidden sm:inline-flex"><i data-lucide="external-link" class="w-4 h-4"></i>سایت</a>
      <button class="btn btn-success font-bold" onclick="publishSite()"><i data-lucide="send" class="w-4 h-4"></i><span class="hidden sm:inline">Publish</span></button>
    </div>
  </header>

  <div class="flex h-[calc(100vh-76px)]">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="desktop-sidebar w-[330px] shrink-0 border-l border-[#202938] bg-[#0d121b] overflow-y-auto">
      <div class="p-4">
        <div class="grid grid-cols-5 gap-1 mb-5 bg-[#080c13] rounded-xl p-1">
          <button class="sidebar-item justify-center px-1 active" data-tab="sections" onclick="switchTab('sections')"><i data-lucide="layers" class="w-4 h-4"></i></button>
          <button class="sidebar-item justify-center px-1" data-tab="theme" onclick="switchTab('theme')"><i data-lucide="palette" class="w-4 h-4"></i></button>
          <button class="sidebar-item justify-center px-1" data-tab="media" onclick="switchTab('media')"><i data-lucide="images" class="w-4 h-4"></i></button>
          <button class="sidebar-item justify-center px-1" data-tab="ai" onclick="switchTab('ai')"><i data-lucide="sparkles" class="w-4 h-4"></i></button>
          <button class="sidebar-item justify-center px-1" data-tab="settings" onclick="switchTab('settings')"><i data-lucide="settings" class="w-4 h-4"></i></button>
        </div>

        <!-- SECTIONS -->
        <section id="tab-sections">
          <div class="flex items-center justify-between mb-3">
            <div><h2 class="font-bold">بەشەکانی وێبسایت</h2><p class="text-xs text-gray-500 mt-1">ڕیزبەندی و دەستکاریکردن</p></div>
            <button class="btn btn-primary px-2" onclick="openAddSectionModal()"><i data-lucide="plus" class="w-4 h-4"></i></button>
          </div>
          <div id="sectionsList" class="space-y-2"></div>
        </section>

        <!-- THEME -->
        <section id="tab-theme" class="hidden">
          <h2 class="font-bold mb-1">ڕووکاری وێبسایت</h2>
          <div class="panel p-4 mb-4">
            <label class="text-sm text-gray-400 block mb-2">ڕەنگی سەرەتا</label>
            <div class="flex gap-2">
              <input id="gradColor1" type="color" class="color-input" onchange="updateField('gradColor1',this.value)">
              <input id="gradColor1Text" class="input" onchange="updateField('gradColor1',this.value)">
            </div>
          </div>
          <div class="panel p-4 mb-4">
            <label class="text-sm text-gray-400 block mb-2">ڕەنگی دووەم</label>
            <div class="flex gap-2">
              <input id="gradColor2" type="color" class="color-input" onchange="updateField('gradColor2',this.value)">
              <input id="gradColor2Text" class="input" onchange="updateField('gradColor2',this.value)">
            </div>
          </div>
          <div class="panel p-4">
            <label class="text-sm text-gray-400 block mb-3">Preset</label>
            <div class="grid grid-cols-2 gap-2">
              <button class="btn" onclick="applyTheme('#9d1c32','#111827')">Kurdia</button>
              <button class="btn" onclick="applyTheme('#0f766e','#082f49')">Nature</button>
              <button class="btn" onclick="applyTheme('#7c2d12','#171717')">Sunset</button>
              <button class="btn" onclick="applyTheme('#4c1d95','#111827')">Night</button>
            </div>
          </div>
        </section>

        <!-- MEDIA -->
        <section id="tab-media" class="hidden">
          <h2 class="font-bold mb-1">Media Library</h2>
          <div class="panel p-4 mb-4">
            <input id="mediaUpload" type="file" accept="image/*" class="hidden" onchange="uploadImage(event)">
            <label for="mediaUpload" class="btn btn-primary w-full cursor-pointer"><i data-lucide="upload" class="w-4 h-4"></i>Upload Image</label>
          </div>
          <div id="mediaGrid" class="grid grid-cols-2 gap-2"></div>
        </section>

        <!-- AI -->
        <section id="tab-ai" class="hidden">
          <div class="panel p-4">
            <textarea id="aiCommand" class="input" placeholder="نموونە: نرخ بکە 50000"></textarea>
            <button class="btn btn-primary w-full mt-3" onclick="runAICommand()"><i data-lucide="wand-sparkles" class="w-4 h-4"></i>جێبەجێکردن</button>
          </div>
        </section>

        <!-- SETTINGS -->
        <section id="tab-settings" class="hidden">
          <div class="panel p-4 mb-4">
            <label class="text-xs text-gray-500">SEO Title</label>
            <input id="seoTitle" class="input mt-2" onchange="updateField('seoTitle',this.value)">
            <label class="text-xs text-gray-500 block mt-4">SEO Description</label>
            <textarea id="seoDescription" class="input mt-2" onchange="updateField('seoDescription',this.value)"></textarea>
          </div>
          <div class="panel p-4 mb-4">
            <label class="flex items-center justify-between">
              <span class="text-sm">Booking کراوە بێت</span>
              <input id="bookingOpen" type="checkbox" onchange="updateField('bookingOpen',this.checked)">
            </label>
          </div>
          <div class="panel p-4 space-y-2">
            <button class="btn w-full" onclick="exportData()"><i data-lucide="download" class="w-4 h-4"></i>Export JSON</button>
            <button class="btn btn-danger w-full" onclick="resetDraft()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>Reset</button>
          </div>
        </section>
      </div>
    </aside>

    <aside id="mobileSidebar" class="mobile-sidebar fixed top-[76px] right-0 bottom-0 w-[320px] max-w-[90vw] z-[100] bg-[#0d121b] border-l border-[#202938] overflow-y-auto shadow-2xl"></aside>

    <!-- PREVIEW -->
    <main class="flex-1 min-w-0 bg-[#070a10] flex flex-col">
      <div class="h-[44px] shrink-0 border-b border-[#202938] bg-[#0b1018] flex items-center justify-between px-4">
        <div class="flex items-center gap-3 text-xs">
          <span class="status-dot"></span>
          <span class="text-gray-400">Live Preview</span>
          <span id="saveStatus" class="text-gray-600">Ready</span>
        </div>
        <div class="text-xs text-gray-600"><span id="viewportLabel">Desktop</span></div>
      </div>
      <div class="flex-1 overflow-auto flex justify-center p-0 md:p-3">
        <div id="viewportFrame" class="viewport-frame viewport-desktop overflow-hidden border-x border-[#252e3d]">
          <iframe id="previewFrame" src="index.html" class="w-full h-full border-0 bg-white"></iframe>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- ============================================================
     SCRIPTS & CONFIGURATION
============================================================ -->
<script>
/* ============================================================
   CONFIGURATION (لێرە ڕێکیانبخە)
============================================================ */

// 1. ئایدی سندوقی داتاکەت لە JSONBin:
const BIN_ID = "6ab7f417ac6210605af863a3";

// 2. کلیلی تایبەتی jsonbin (لە بەشی API Keys دەیهێنیت، وەک $2a$10$...):
const API_KEY = "کلیلەکەت_لێرە_دابنێ";

// 3. کلیلی سایتی ImgBB بۆ ئەوەی وێنەکان ڕاستەوخۆ باربکرێن:
const IMGBB_KEY = "کلیلی_ئیمجب_لێرە_دابنێ";

// 4. وشەی نهێنی چوونەژوورەوەی ئەدمین:
const SECRET_PIN = "2026";

/* ============================================================
   DEFAULT DATA & LOGIC
============================================================ */
const STORAGE_KEY = "kurdia_builder_draft_v3";
const PUBLISHED_KEY = "kurdia_builder_published_v3";

const DEFAULT_DATA = {
  gradColor1: "#9d1c32",
  gradColor2: "#111827",
  heroBadge: "KURDIA ADVENTURE",
  heroTitle: "گەشتێک بۆ ناو سروشتی کوردستان",
  heroSubtitle: "گەشت، سروشت، هاوڕێتی و یادەوەرییەکان لەگەڵ KURDIA ADVENTURE",
  heroImageUrl: "",
  bookingOpen: true,
  tripTitle: "گەشتی تایبەتی کوردیا",
  tripPrice: "50,000 IQD",
  tripDifficulty: "ئاسان",
  tripDuration: "1 ڕۆژ",
  tripTime: "06:00",
  tripLocation: "کوردستان",
  tripDesc: "گەشتێکی جوان بۆ ناو سروشت و شوێنە جوانەکانی کوردستان.",
  step1: "کۆبوونەوە", step2: "گەشتکردن", step3: "چوونە ناو سروشت", step4: "گەڕانەوە",
  seoTitle: "KURDIA ADVENTURE",
  seoDescription: "گەشت و سەرکێشی لە سروشتی کوردستان.",
  socialImage: "",
  gallery: [],
  sections: [
    { id: "hero_1", type: "hero", title: "Hero", visible: true },
    { id: "trip_1", type: "trip", title: "گەشت", visible: true },
    { id: "services_1", type: "services", title: "خزمەتگوزاری", visible: true },
    { id: "booking_1", type: "booking", title: "Booking", visible: true }
  ]
};

let state = loadDraft();
let historyStack = [];
let historyIndex = -1;
let selectedSectionId = null;
let currentViewport = "desktop";
let draggedSectionId = null;

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const pin = document.getElementById("pinInput").value;
  if (pin === SECRET_PIN) {
    sessionStorage.setItem("kurdia_admin_logged_in", "1");
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    initialize();
  } else {
    document.getElementById("loginError").classList.remove("hidden");
    document.getElementById("pinInput").value = "";
    setTimeout(() => document.getElementById("loginError").classList.add("hidden"), 2500);
  }
});

function initialize() {
  if (!state || !state.sections) state = clone(DEFAULT_DATA);
  pushHistory(false);
  renderSectionsList();
  renderMedia();
  syncInputs();
  setupIcons();
  updatePreview();
}

function setupIcons() {
  if (window.lucide) lucide.createIcons();
}

if (sessionStorage.getItem("kurdia_admin_logged_in") === "1") {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  initialize();
}

function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

function showToast(message, type = "normal") {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = "toast show";
  if (type === "success") toast.style.borderColor = "#205842";
  if (type === "error") toast.style.borderColor = "#63202d";
  setTimeout(() => toast.classList.remove("show"), 2600);
}

function saveDraft() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  document.getElementById("saveStatus").textContent = "Saved";
}

function loadDraft() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return mergeData(clone(DEFAULT_DATA), JSON.parse(saved));
  } catch (error) { console.error(error); }
  return clone(DEFAULT_DATA);
}

function mergeData(base, extra) {
  const result = { ...base, ...extra };
  if (!Array.isArray(result.sections)) result.sections = clone(DEFAULT_DATA.sections);
  if (!Array.isArray(result.gallery)) result.gallery = [];
  return result;
}

function pushHistory(save = true) {
  const snapshot = clone(state);
  if (historyStack.length && JSON.stringify(historyStack[historyIndex]) === JSON.stringify(snapshot)) return;
  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(snapshot);
  if (historyStack.length > 30) historyStack.shift();
  historyIndex = historyStack.length - 1;
  if (save) saveDraft();
}

function undoState() {
  if (historyIndex <= 0) return showToast("هیچ گۆڕانکارییەکی پێشوو نییە");
  historyIndex--;
  state = clone(historyStack[historyIndex]);
  saveDraft(); renderAll(); showToast("گۆڕانکاری گەڕێندرایەوە");
}

function redoState() {
  if (historyIndex >= historyStack.length - 1) return showToast("هیچ گۆڕانکارییەکی داهاتوو نییە");
  historyIndex++;
  state = clone(historyStack[historyIndex]);
  saveDraft(); renderAll(); showToast("گۆڕانکاری دووبارە جێبەجێکرا");
}

function renderAll() {
  renderSectionsList();
  renderMedia();
  syncInputs();
  updatePreview();
  setupIcons();
}

function updateField(field, value) {
  pushHistory(false);
  state[field] = value;
  saveDraft();
  syncInputs();
  updatePreview();
}

function syncInputs() {
  const ids = ["gradColor1", "gradColor2", "gradColor1Text", "gradColor2Text", "seoTitle", "seoDescription"];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const field = id.replace("Text", "");
    if (field in state) el.value = state[field] ?? "";
  });
  const booking = document.getElementById("bookingOpen");
  if (booking) booking.checked = !!state.bookingOpen;
}

function renderSectionsList() {
  const container = document.getElementById("sectionsList");
  if (!container) return;
  container.innerHTML = "";
  state.sections.forEach(section => {
    const row = document.createElement("div");
    row.className = "section-row " + (selectedSectionId === section.id ? "selected " : "") + (!section.visible ? "hidden-section" : "");
    row.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold">${escapeHTML(section.title)}</span>
        <button class="p-1.5 text-gray-500 hover:text-white" onclick="event.stopPropagation(); toggleSection('${section.id}')">
          <i data-lucide="${section.visible ? "eye" : "eye-off"}" class="w-4 h-4"></i>
        </button>
      </div>`;
    container.appendChild(row);
  });
  setupIcons();
}

function toggleSection(id) {
  const section = state.sections.find(s => s.id === id);
  if (!section) return;
  pushHistory(false);
  section.visible = !section.visible;
  saveDraft();
  renderAll();
}

function switchTab(tab) {
  ["sections", "theme", "media", "ai", "settings"].forEach(name => {
    const el = document.getElementById("tab-" + name);
    if (el) el.classList.toggle("hidden", name !== tab);
  });
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });
}

function setViewport(type) {
  currentViewport = type;
  const frame = document.getElementById("viewportFrame");
  frame.className = "viewport-frame viewport-" + type + " overflow-hidden border-x border-[#252e3d]";
  document.getElementById("viewportLabel").textContent = type.charAt(0).toUpperCase() + type.slice(1);
}

function toggleMobileSidebar() {
  const sidebar = document.getElementById("mobileSidebar");
  if (sidebar.innerHTML.trim() === "") {
    sidebar.innerHTML = document.getElementById("sidebar").innerHTML;
    setupIcons();
  }
  sidebar.classList.toggle("hidden");
}

function applyTheme(color1, color2) {
  pushHistory(false);
  state.gradColor1 = color1;
  state.gradColor2 = color2;
  saveDraft();
  syncInputs();
  updatePreview();
  showToast("Theme نوێ کرا", "success");
}

function updatePreview() {
  const frame = document.getElementById("previewFrame");
  if (!frame || !frame.contentWindow) return;
  try {
    frame.contentWindow.postMessage({ type: "KURDIA_BUILDER_STATE", state: clone(state) }, "*");
  } catch (error) { console.error(error); }
}

async function uploadImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  showToast("وێنەکە باردەکرێت...");
  if (IMGBB_KEY && !IMGBB_KEY.includes("لێرە_دابنێ")) {
    try {
      const form = new FormData();
      form.append("image", file);
      const res = await fetch("https://api.imgbb.com/1/upload?key=" + encodeURIComponent(IMGBB_KEY), { method: "POST", body: form });
      const result = await res.json();
      if (result.success && result.data && result.data.url) {
        state.gallery.push({ id: "img_" + Date.now(), url: result.data.url, name: file.name });
        saveDraft(); renderMedia(); showToast("وێنەکە سەرکەوتووانە بەرزکرایەوە", "success");
        return;
      }
    } catch (e) { console.error(e); }
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    state.gallery.push({ id: "img_" + Date.now(), url: e.target.result, name: file.name });
    saveDraft(); renderMedia(); showToast("وێنەکە بە شێوەی خۆجێیی هەڵگیرا", "success");
  };
  reader.readAsDataURL(file);
}

function renderMedia() {
  const grid = document.getElementById("mediaGrid");
  if (!grid) return;
  grid.innerHTML = "";
  state.gallery.forEach(img => {
    const item = document.createElement("div");
    item.className = "relative aspect-square rounded-xl overflow-hidden border border-[#202938]";
    item.innerHTML = `<img src="${escapeAttr(img.url)}" class="w-full h-full object-cover">`;
    grid.appendChild(item);
  });
}

function runAICommand() {
  const val = document.getElementById("aiCommand").value.trim();
  if (!val) return;
  const priceMatch = val.match(/(?:نرخ|پارە).{0,20}?(?:بکە|بگۆڕە)\s*([0-9۰-۹,،]+)/i);
  if (priceMatch) {
    state.tripPrice = priceMatch[1] + " IQD";
    saveDraft(); renderAll(); showToast("نرخ نوێکرایەوە", "success");
  }
}

async function saveToJSONBin() {
  if (!BIN_ID || !API_KEY || API_KEY.includes("لێرە_دابنێ")) return false;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Access-Key": API_KEY },
      body: JSON.stringify(state)
    });
    return res.ok;
  } catch (e) { return false; }
}

async function publishSite() {
  document.getElementById("saveStatus").textContent = "Publishing...";
  localStorage.setItem(PUBLISHED_KEY, JSON.stringify(state));
  const remoteSaved = await saveToJSONBin();
  document.getElementById("saveStatus").textContent = remoteSaved ? "Published" : "Published Local";
  showToast(remoteSaved ? "وێبسایتەکە ڕاستەوخۆ بڵاوکرایەوە" : "تەنها بە شێوەی خۆجێیی پاشەکەوت کرا", "success");
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kurdia-website-data.json";
  a.click();
}

function resetDraft() {
  if (!confirm("هەموو شتێک بگەڕێتەوە دۆخی سەرەتایی؟")) return;
  state = clone(DEFAULT_DATA);
  saveDraft(); renderAll(); showToast("گەڕێندرایەوە بۆ سەرەتا");
}

function escapeHTML(str) { return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escapeAttr(str) { return escapeHTML(str); }

setupIcons();
</script>
</body>
</html>
