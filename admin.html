<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەڕێوەبەری ماڵپەڕ | Kurdia Adventure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-[#0B0F19] text-gray-100 min-h-screen p-4 sm:p-8">

  <!-- بەشی چوونەژوورەوە بە وشەی نهێنی -->
  <div id="loginScreen" class="max-w-md mx-auto mt-20 bg-[#1E293B] border border-gray-700 p-8 rounded-2xl shadow-2xl text-center">
    <div class="w-16 h-16 bg-yellow-500/10 border border-yellow-500/30 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
      🔐
    </div>
    <h2 class="text-2xl font-bold text-white mb-2">بەڕێوەبەری ماڵپەڕ</h2>
    <p class="text-xs text-gray-400 mb-6">وشەی نهێنی بنووسە بۆ دەستکاریکردنی ماڵپەڕ</p>
    
    <input type="password" id="pinInput" placeholder="وشەی نهێنی" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl px-4 py-3 text-center text-lg tracking-widest text-white mb-4 focus:outline-none focus:border-yellow-500">
    <button onclick="checkPin()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold py-3.5 rounded-xl transition">چوونەژوورەوە</button>
  </div>

  <!-- داشبۆردی بەڕێوەبردن -->
  <div id="adminDashboard" class="hidden max-w-3xl mx-auto space-y-8">
    <div class="flex items-center justify-between border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-extrabold text-white">کۆنتڕۆڵی کوردیا ئەدڤێنتچەر</h1>
        <p class="text-xs text-gray-400">دەستکاریکردنی ڕاستەوخۆی گەشت، ڕەنگ و وێنەکان</p>
      </div>
      <button onclick="saveToCloud()" id="saveBtn" class="bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold px-6 py-2.5 rounded-xl text-sm shadow-lg transition">
        پاشەکەوت و بڵاوکردنەوە
      </button>
    </div>

    <!-- بەشی ڕەنگەکان -->
    <div class="bg-[#1E293B] border border-gray-800 p-6 rounded-2xl space-y-4">
      <h3 class="text-base font-bold text-white">🎨 ڕەنگی سەرەکیی ماڵپەڕ</h3>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <label class="flex items-center gap-2 bg-[#0F172A] p-3 rounded-xl border border-gray-700 cursor-pointer">
          <input type="radio" name="siteColor" value="#EAB308">
          <span class="w-4 h-4 rounded-full bg-yellow-500"></span>
          <span class="text-xs font-semibold">زەرد</span>
        </label>
        <label class="flex items-center gap-2 bg-[#0F172A] p-3 rounded-xl border border-gray-700 cursor-pointer">
          <input type="radio" name="siteColor" value="#10B981">
          <span class="w-4 h-4 rounded-full bg-emerald-500"></span>
          <span class="text-xs font-semibold">سەوز</span>
        </label>
        <label class="flex items-center gap-2 bg-[#0F172A] p-3 rounded-xl border border-gray-700 cursor-pointer">
          <input type="radio" name="siteColor" value="#F97316">
          <span class="w-4 h-4 rounded-full bg-orange-500"></span>
          <span class="text-xs font-semibold">پرتەقاڵی</span>
        </label>
        <label class="flex items-center gap-2 bg-[#0F172A] p-3 rounded-xl border border-gray-700 cursor-pointer">
          <input type="radio" name="siteColor" value="#06B6D4" checked>
          <span class="w-4 h-4 rounded-full bg-cyan-500"></span>
          <span class="text-xs font-semibold">شینی ئاسمانی</span>
        </label>
      </div>
    </div>

    <!-- زانیاریی گەشتی نوێ -->
    <div class="bg-[#1E293B] border border-gray-800 p-6 rounded-2xl space-y-4">
      <h3 class="text-base font-bold text-white">🏔️ زانیاریی گەشتی نوێ</h3>
      
      <div>
        <label class="text-xs text-gray-400 block mb-1">ناوی گەشت / شوێن</label>
        <input type="text" id="tripTitle" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-gray-400 block mb-1">نرخی بەشداربوون</label>
          <input type="text" id="tripPrice" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">ئاستی سەختی</label>
          <select id="tripDifficulty" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
            <option value="ئاسان">ئاسان</option>
            <option value="مامناوەند">مامناوەند</option>
            <option value="سەخت">سەخت</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-gray-400 block mb-1">کاتژمێری کۆبوونەوە</label>
          <input type="text" id="tripTime" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">شوێنی کۆبوونەوە</label>
          <input type="text" id="tripLocation" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
        </div>
      </div>

      <div>
        <label class="text-xs text-gray-400 block mb-1">کورتەی ڕێڕەو و گەشتەکە</label>
        <textarea id="tripDesc" rows="3" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500"></textarea>
      </div>
    </div>

    <!-- بەشی وێنەی سەرەکی -->
    <div class="bg-[#1E293B] border border-gray-800 p-6 rounded-2xl space-y-4">
      <h3 class="text-base font-bold text-white">📸 وێنەی سەرەکیی ماڵپەڕ</h3>
      <div>
        <label class="text-xs text-gray-400 block mb-1">لینکی وێنە (Image URL)</label>
        <input type="text" id="heroImageUrl" class="w-full bg-[#0F172A] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500" dir="ltr">
      </div>
    </div>
  </div>

  <script>
    const BIN_ID = "6ab7f417ac6210605af863a3";
    const API_KEY = "$2a$10$8avc1KliyAqa2Nof1YPm8eks0PGlSxSbJse5LUrK5irHtbVfhu.WW";
    const SECRET_PIN = "2026";

    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === SECRET_PIN) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        fetchCurrentData();
      } else {
        alert("وشەی نهێنی هەڵەیە!");
      }
    }

    async function fetchCurrentData() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = (await res.json()).record;

        document.getElementById('tripTitle').value = data.tripTitle || '';
        document.getElementById('tripPrice').value = data.tripPrice || '';
        document.getElementById('tripDifficulty').value = data.tripDifficulty || 'مامناوەند';
        document.getElementById('tripTime').value = data.tripTime || '';
        document.getElementById('tripLocation').value = data.tripLocation || '';
        document.getElementById('tripDesc').value = data.tripDesc || '';
        document.getElementById('heroImageUrl').value = data.heroImageUrl || '';

        const radios = document.getElementsByName('siteColor');
        for (let r of radios) {
          if (r.value === data.color) r.checked = true;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function saveToCloud() {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = "کەمێک چاوەڕێ بکە...";

      const selectedColor = document.querySelector('input[name="siteColor"]:checked').value;
      const payload = {
        color: selectedColor,
        tripTitle: document.getElementById('tripTitle').value,
        tripPrice: document.getElementById('tripPrice').value,
        tripDifficulty: document.getElementById('tripDifficulty').value,
        tripTime: document.getElementById('tripTime').value,
        tripLocation: document.getElementById('tripLocation').value,
        tripDesc: document.getElementById('tripDesc').value,
        heroImageUrl: document.getElementById('heroImageUrl').value
      };

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(payload)
        });

        saveBtn.innerText = "بڵاوکرایەوە! ✓";
        saveBtn.classList.replace('bg-yellow-500', 'bg-emerald-500');
        setTimeout(() => {
          saveBtn.innerText = "پاشەکەوت و بڵاوکردنەوە";
          saveBtn.classList.replace('bg-emerald-500', 'bg-yellow-500');
          saveBtn.disabled = false;
        }, 2000);
      } catch (err) {
        alert("کێشەیەک ڕوویدا لە کاتی پاشەکەوتکردن!");
        saveBtn.disabled = false;
        saveBtn.innerText = "پاشەکەوت و بڵاوکردنەوە";
      }
    }
  </script>
</body>
</html>
