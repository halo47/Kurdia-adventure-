<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KURDIA ADMIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#070a10;
  --panel:#0d121b;
  --panel2:#111927;
  --border:rgba(255,255,255,.08);
  --text:#fff;
  --muted:#94a3b8;
  --primary:#9d1c32;
  --primary2:#c92b49;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
}

body{
  overflow:hidden;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-track{
  background:#080b11;
}

::-webkit-scrollbar-thumb{
  background:#303746;
  border-radius:20px;
}

.hidden-force{
  display:none!important;
}

.login-screen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 20%,rgba(157,28,50,.22),transparent 35%),
    #05070b;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  padding:35px;
  border-radius:30px;
  background:rgba(13,18,27,.92);
  border:1px solid var(--border);
  box-shadow:0 35px 100px rgba(0,0,0,.55);
  backdrop-filter:blur(20px);
}

.logo-box{
  width:60px;
  height:60px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 15px 40px rgba(157,28,50,.28);
}

.input{
  width:100%;
  background:#080c13;
  border:1px solid var(--border);
  color:#fff;
  border-radius:14px;
  padding:13px 15px;
  outline:none;
  transition:.2s;
}

.input:focus{
  border-color:rgba(201,43,73,.7);
  box-shadow:0 0 0 3px rgba(157,28,50,.10);
}

.textarea{
  min-height:120px;
  resize:vertical;
}

.primary{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 12px 35px rgba(157,28,50,.22);
}

.primary:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.btn{
  transition:.2s;
}

.btn:active{
  transform:scale(.98);
}

.app{
  height:100vh;
  display:grid;
  grid-template-columns:270px 1fr;
  overflow:hidden;
}

.sidebar{
  background:#090d14;
  border-left:1px solid var(--border);
  overflow-y:auto;
  padding:18px;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.topbar{
  height:70px;
  flex:0 0 70px;
  background:rgba(7,10,16,.92);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  backdrop-filter:blur(15px);
  z-index:20;
}

.workspace{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:330px minmax(0,1fr) 350px;
  overflow:hidden;
}

.panel{
  background:#0a0f17;
  border-left:1px solid var(--border);
  overflow-y:auto;
}

.panel:last-child{
  border-left:0;
  border-right:1px solid var(--border);
}

.panel-title{
  padding:17px;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:800;
  position:sticky;
  top:0;
  background:#0a0f17;
  z-index:5;
}

.section-list{
  padding:12px;
}

.section-item{
  background:#0e1520;
  border:1px solid rgba(255,255,255,.06);
  border-radius:15px;
  padding:12px;
  margin-bottom:8px;
  transition:.2s;
}

.section-item:hover{
  border-color:rgba(255,255,255,.14);
}

.section-item.active{
  border-color:rgba(157,28,50,.8);
  background:rgba(157,28,50,.10);
}

.section-item.dragging{
  opacity:.35;
}

.section-main{
  display:flex;
  align-items:center;
  gap:9px;
}

.drag-handle{
  color:#64748b;
  cursor:grab;
}

.section-icon{
  width:35px;
  height:35px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.05);
  color:#cbd5e1;
  flex:0 0 auto;
}

.section-name{
  min-width:0;
  flex:1;
}

.section-name strong{
  display:block;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.section-name span{
  display:block;
  color:#64748b;
  font-size:10px;
  margin-top:2px;
}

.mini-btn{
  width:31px;
  height:31px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.045);
  color:#94a3b8;
}

.mini-btn:hover{
  background:rgba(255,255,255,.09);
  color:#fff;
}

.preview{
  min-width:0;
  min-height:0;
  position:relative;
  background:
    radial-gradient(circle at 50% 20%,rgba(157,28,50,.08),transparent 30%),
    #070a10;
  display:flex;
  flex-direction:column;
}

.preview-toolbar{
  height:54px;
  flex:0 0 54px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:#090e16;
}

.device-btn{
  height:34px;
  padding:0 11px;
  border-radius:9px;
  background:rgba(255,255,255,.04);
  color:#94a3b8;
  border:1px solid transparent;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:6px;
}

.device-btn.active{
  background:rgba(157,28,50,.14);
  border-color:rgba(157,28,50,.4);
  color:#fff;
}

.preview-area{
  min-height:0;
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px;
  overflow:auto;
}

.preview-frame{
  background:#fff;
  width:100%;
  height:100%;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.45);
  transition:.3s;
}

.preview-frame.tablet{
  width:768px;
  max-width:100%;
}

.preview-frame.mobile{
  width:390px;
  max-width:100%;
}

.preview-frame iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}

.inspector{
  padding:15px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:11px;
  color:#94a3b8;
  margin-bottom:7px;
}

.field-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:15px;
}

.divider{
  height:1px;
  background:var(--border);
  margin:20px 0;
}

.switch{
  width:43px;
  height:25px;
  border-radius:50px;
  background:#263142;
  position:relative;
  transition:.2s;
}

.switch span{
  position:absolute;
  width:19px;
  height:19px;
  top:3px;
  right:3px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch.on{
  background:var(--primary);
}

.switch.on span{
  right:21px;
}

.media-card{
  position:relative;
  aspect-ratio:1;
  border-radius:13px;
  overflow:hidden;
  border:1px solid var(--border);
  background:#111827;
}

.media-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.media-remove{
  position:absolute;
  top:5px;
  left:5px;
  width:27px;
  height:27px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
  color:#fff;
}

.service-row,
.faq-row,
.gallery-row{
  background:#0c131d;
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px;
  margin-bottom:8px;
}

.empty{
  padding:40px 20px;
  text-align:center;
  color:#64748b;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:999999;
  background:#111827;
  border:1px solid var(--border);
  padding:13px 18px;
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  transform:translateY(120px);
  opacity:0;
  transition:.3s;
  font-size:12px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.mobile-sidebar-button{
  display:none;
}

@media(max-width:1200px){
  .workspace{
    grid-template-columns:280px minmax(0,1fr);
  }

  .inspector-panel{
    display:none;
  }
}

@media(max-width:850px){
  body{
    overflow:auto;
  }

  .app{
    display:block;
    height:auto;
    min-height:100vh;
  }

  .sidebar{
    position:fixed;
    top:0;
    bottom:0;
    right:0;
    width:290px;
    z-index:1000;
    transform:translateX(100%);
    transition:.25s;
    box-shadow:-20px 0 60px rgba(0,0,0,.45);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    min-height:100vh;
  }

  .workspace{
    display:block;
    overflow:visible;
  }

  .sections-panel{
    display:none;
  }

  .preview{
    height:calc(100vh - 70px);
  }

  .mobile-sidebar-button{
    display:flex;
  }

  .topbar{
    padding:0 12px;
  }

  .topbar-actions .desktop-only{
    display:none;
  }
}

@media(max-width:500px){
  .preview-area{
    padding:8px;
  }

  .preview-frame{
    border-radius:8px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="flex justify-center">
      <div class="logo-box">
        <i data-lucide="mountain" class="w-7 h-7"></i>
      </div>
    </div>

    <div class="text-center mt-6">

      <div class="text-2xl font-black">
        KURDIA ADMIN
      </div>

      <div class="text-xs text-gray-500 mt-2">
        Smart Website Builder
      </div>

    </div>

    <div class="mt-8">

      <label class="block text-xs text-gray-400 mb-2">
        کۆدی چوونەژوورەوە
      </label>

      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        class="input text-center tracking-[.5em]"
        placeholder="••••"
        maxlength="20"
        onkeydown="if(event.key==='Enter') login()"
      >

      <button
        onclick="login()"
        class="btn primary w-full mt-4 rounded-xl py-3.5 font-bold"
      >
        چوونەژوورەوە
      </button>

      <div
        id="loginError"
        class="text-red-400 text-xs text-center mt-4 min-h-[18px]"
      ></div>

    </div>

  </div>

</div>


<!-- APP -->

<div id="app" class="app hidden-force">

  <!-- SIDEBAR -->

  <aside id="sidebar" class="sidebar">

    <div class="flex items-center gap-3 px-2 pb-5">

      <div class="logo-box !w-11 !h-11 !rounded-xl">
        <i data-lucide="mountain" class="w-5 h-5"></i>
      </div>

      <div>

        <div class="font-black text-sm">
          KURDIA
        </div>

        <div class="text-[9px] text-gray-500 tracking-widest">
          ADMIN
        </div>

      </div>

    </div>


    <div class="text-[10px] text-gray-600 font-bold px-2 mb-2">
      بەڕێوەبردن
    </div>


    <div class="space-y-1">

      <button
        class="w-full flex items-center gap-3 px-3 py-3 rounded-xl bg-white/5 text-white text-sm"
      >
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        داشبۆرد
      </button>

      <button
        onclick="focusSections()"
        class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white text-sm"
      >
        <i data-lucide="layers-3" class="w-4 h-4"></i>
        بەشەکانی سایت
      </button>

      <button
        onclick="focusMedia()"
        class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white text-sm"
      >
        <i data-lucide="images" class="w-4 h-4"></i>
        وێنەکان
      </button>

      <button
        onclick="focusTheme()"
        class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white text-sm"
      >
        <i data-lucide="palette" class="w-4 h-4"></i>
        ڕەنگ و ڕووکاری
      </button>

    </div>


    <div class="divider"></div>


    <div class="flex items-center justify-between px-2 mb-2">

      <div class="text-[10px] text-gray-600 font-bold">
        بەشەکان
      </div>

      <button
        onclick="addSection()"
        class="mini-btn"
        title="زیادکردنی بەش"
      >
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>

    </div>


    <div id="sectionList" class="section-list p-0"></div>


    <div class="mt-5 pt-5 border-t border-white/5">

      <button
        onclick="logout()"
        class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-gray-500 hover:text-red-400 hover:bg-red-500/5 text-sm"
      >
        <i data-lucide="log-out" class="w-4 h-4"></i>
        چوونەدەرەوە
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

      <div class="flex items-center gap-3">

        <button
          onclick="toggleSidebar()"
          class="mobile-sidebar-button mini-btn"
        >
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <div>

          <div class="font-black text-sm">
            Smart Website Builder
          </div>

          <div class="text-[10px] text-gray-600">
            KURDIA ADVENTURE
          </div>

        </div>

      </div>


      <div class="topbar-actions flex items-center gap-2">

        <button
          onclick="undo()"
          class="desktop-only mini-btn"
          title="Undo"
        >
          <i data-lucide="undo-2" class="w-4 h-4"></i>
        </button>

        <button
          onclick="redo()"
          class="desktop-only mini-btn"
          title="Redo"
        >
          <i data-lucide="redo-2" class="w-4 h-4"></i>
        </button>

        <button
          onclick="saveDraft()"
          class="desktop-only px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold"
        >
          پاشەکەوتکردن
        </button>

        <button
          onclick="publish()"
          class="primary px-5 py-2.5 rounded-xl text-xs font-bold btn"
        >
          <span class="flex items-center gap-2">
            <i data-lucide="cloud-upload" class="w-4 h-4"></i>
            Publish
          </span>
        </button>

      </div>

    </header>


    <!-- WORKSPACE -->

    <div class="workspace">

      <!-- SECTIONS -->

      <section
        id="sectionsPanel"
        class="panel sections-panel"
      >

        <div class="panel-title flex items-center justify-between">

          <span>
            بەشەکانی ویبسایت
          </span>

          <button
            onclick="addSection()"
            class="mini-btn"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>

        </div>

        <div
          id="desktopSectionList"
          class="section-list"
        ></div>

      </section>


      <!-- PREVIEW -->

      <section class="preview">

        <div class="preview-toolbar">

          <button
            class="device-btn active"
            data-device="desktop"
            onclick="setDevice('desktop',this)"
          >
            <i data-lucide="monitor" class="w-4 h-4"></i>
            Desktop
          </button>

          <button
            class="device-btn"
            data-device="tablet"
            onclick="setDevice('tablet',this)"
          >
            <i data-lucide="tablet" class="w-4 h-4"></i>
            Tablet
          </button>

          <button
            class="device-btn"
            data-device="mobile"
            onclick="setDevice('mobile',this)"
          >
            <i data-lucide="smartphone" class="w-4 h-4"></i>
            Mobile
          </button>

          <button
            onclick="reloadPreview()"
            class="device-btn"
            title="نوێکردنەوە"
          >
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>

          <button
            onclick="openWebsite()"
            class="device-btn"
            title="کردنەوەی سایت"
          >
            <i data-lucide="external-link" class="w-4 h-4"></i>
          </button>

        </div>


        <div class="preview-area">

          <div
            id="previewFrame"
            class="preview-frame"
          >

            <iframe
              id="sitePreview"
              src="index.html"
              title="KURDIA Website Preview"
            ></iframe>

          </div>

        </div>

      </section>


      <!-- INSPECTOR -->

      <section
        id="inspectorPanel"
        class="panel inspector-panel"
      >

        <div class="panel-title flex items-center justify-between">

          <span>
            دەستکاریکردن
          </span>

          <button
            onclick="closeInspector()"
            class="mini-btn"
          >
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>

        </div>

        <div
          id="inspector"
          class="inspector"
        ></div>

      </section>

    </div>

  </main>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const SECRET_PIN = "2026";

const DRAFT_KEY =
  "kurdia_builder_draft_v3";

const PUBLISHED_KEY =
  "kurdia_builder_published_v3";

/*
  ئەگەر Worker ـەکەت هەیە،
  تەنها ئەم URL ـە دابنێ.
*/
const REMOTE_ENDPOINT =
  window.KURDIA_ADMIN_ENDPOINT || "";


/* =========================================================
   DEFAULT DATA
========================================================= */

const DEFAULT_DATA = {

  gradColor1:"#9d1c32",

  gradColor2:"#111827",

  heroBadge:"KURDIA ADVENTURE",

  heroTitle:"گەشتێک بۆ ناو سروشتی کوردستان",

  heroSubtitle:"گەشت، سروشت، هاوڕێتی و یادەوەرییەکان لەگەڵ KURDIA ADVENTURE",

  heroImageUrl:"",

  bookingOpen:true,

  tripTitle:"گەشتی تایبەتی کوردیا",

  tripPrice:"50,000 IQD",

  tripDifficulty:"ئاسان",

  tripDuration:"1 ڕۆژ",

  tripTime:"06:00",

  tripLocation:"کوردستان",

  tripDesc:"گەشتێکی تایبەتی بۆ ناو سروشت و شوێنە جوانەکانی کوردستان.",

  step1:"کۆبوونەوە",

  step2:"گەشتکردن",

  step3:"چوونە ناو سروشت",

  step4:"گەڕانەوە",

  services:[],

  gallery:[],

  faq:[],

  sections:[

    {
      id:"hero_1",
      type:"hero",
      title:"Hero",
      visible:true
    },

    {
      id:"trip_1",
      type:"trip",
      title:"گەشت",
      visible:true
    },

    {
      id:"services_1",
      type:"services",
      title:"خزمەتگوزاری",
      visible:true
    },

    {
      id:"steps_1",
      type:"steps",
      title:"چۆن بەشداری بکەیت؟",
      visible:true
    },

    {
      id:"gallery_1",
      type:"gallery",
      title:"وێنەکان",
      visible:true
    },

    {
      id:"faq_1",
      type:"faq",
      title:"پرسیارەکان",
      visible:true
    },

    {
      id:"booking_1",
      type:"booking",
      title:"بەشداری",
      visible:true
    }

  ]

};


/* =========================================================
   STATE
========================================================= */

let state =
  clone(DEFAULT_DATA);

let selectedId =
  null;

let history = [];

let historyIndex =
  -1;

let draggedId =
  null;


/* =========================================================
   UTILS
========================================================= */

function clone(obj){
  return JSON.parse(
    JSON.stringify(obj)
  );
}


function mergeData(base,extra){

  const result = {
    ...base,
    ...extra
  };

  if(!Array.isArray(result.sections)){
    result.sections =
      clone(DEFAULT_DATA.sections);
  }

  if(!Array.isArray(result.services)){
    result.services = [];
  }

  if(!Array.isArray(result.gallery)){
    result.gallery = [];
  }

  if(!Array.isArray(result.faq)){
    result.faq = [];
  }

  return result;
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){
  return escapeHtml(value);
}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =

  toast.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      ()=>{
        toast.classList.remove("show");
      },
      3000
    );
}

/* =========================================================
   LOAD
========================================================= */

function loadState(){

  try{

    const draft =
      localStorage.getItem(
        DRAFT_KEY
      );

    const published =
      localStorage.getItem(
        PUBLISHED_KEY
      );

    if(draft){

      return mergeData(
        clone(DEFAULT_DATA),
        JSON.parse(draft)
      );

    }

    if(published){

      return mergeData(
        clone(DEFAULT_DATA),
        JSON.parse(published)
      );

    }

  }catch(error){

    console.error(error);

  }

  return clone(
    DEFAULT_DATA
  );
}


/* =========================================================
   HISTORY
========================================================= */

function initializeHistory(){

  history = [
    clone(state)
  ];

  historyIndex = 0;
}


function commit(){

  history =
    history.slice(
      0,
      historyIndex + 1
    );

  history.push(
    clone(state)
  );

  if(history.length > 40){

    history.shift();

  }else{

    historyIndex++;

  }

  saveDraft(false);

  renderAll();

}


function undo(){

  if(historyIndex <= 0){

    showToast(
      "هیچ گۆڕانکارییەکی تر نییە."
    );

    return;
  }

  historyIndex--;

  state =
    clone(
      history[historyIndex]
    );

  saveDraft(false);

  renderAll();

}


function redo(){

  if(
    historyIndex >=
    history.length - 1
  ){

    showToast(
      "هیچ گۆڕانکارییەکی تر نییە."
    );

    return;
  }

  historyIndex++;

  state =
    clone(
      history[historyIndex]
    );

  saveDraft(false);

  renderAll();

}


/* =========================================================
   SAVE
========================================================= */

function saveDraft(show=true){

  localStorage.setItem(
    DRAFT_KEY,
    JSON.stringify(state)
  );

  if(show){

    showToast(
      "✓ Draft پاشەکەوت کرا."
    );

  }

}


/* =========================================================
   PUBLISH
========================================================= */

async function publish(){

  try{

    localStorage.setItem(
      PUBLISHED_KEY,
      JSON.stringify(state)
    );

    /*
      ناردنی state بۆ preview
    */

    sendStateToPreview();

    /*
      ئەگەر endpoint دانراوە،
      state بۆ online API دەنێرێت.
    */

    if(REMOTE_ENDPOINT){

      const response =
        await fetch(
          REMOTE_ENDPOINT,
          {
            method:"PUT",

            headers:{
              "Content-Type":
                "application/json",

              "X-Admin-Pin":
                SECRET_PIN
            },

            body:
              JSON.stringify(state)
          }
        );

      if(!response.ok){

        throw new Error(
          "Online publish failed"
        );

      }

    }

    showToast(
      "✓ گۆڕانکارییەکان Publish کران."
    );

  }catch(error){

    console.error(error);

    showToast(
      "❌ Publish سەرکەوتوو نەبوو."
    );

  }

}

/* =========================================================
   DRAG DROP
========================================================= */

function bindDragDrop(){

  document
    .querySelectorAll(
      ".section-item"
    )
    .forEach(
      item => {

        item.addEventListener(
          "dragstart",
          event => {

            draggedId =
              item.dataset.sectionId;

            item.classList.add(
              "dragging"
            );

            event.dataTransfer.effectAllowed =
              "move";

          }
        );

        item.addEventListener(
          "dragend",
          () => {

            item.classList.remove(
              "dragging"
            );

          }
        );

        item.addEventListener(
          "dragover",
          event => {

            event.preventDefault();

          }
        );

        item.addEventListener(
          "drop",
          event => {

            event.preventDefault();

            const targetId =
              item.dataset.sectionId;

            if(
              !draggedId ||
              draggedId === targetId
            ){

              return;
            }

            const from =
              state.sections.findIndex(
                s =>
                  s.id === draggedId
              );

            const to =
              state.sections.findIndex(
                s =>
                  s.id === targetId
              );

            if(
              from < 0 ||
              to < 0
            ){

              return;

            }

            const moved =
              state.sections.splice(
                from,
                1
              )[0];

            state.sections.splice(
              to,
              0,
              moved
            );

            commit();

            draggedId =
              null;

          }
        );

      }
    );

}

/* =========================================================

========================================================= */

function bindInspectorEvents(){

  const bindings = [

    ["heroBadge","heroBadge"],
    ["heroTitle","heroTitle"],
    ["heroSubtitle","heroSubtitle"],
    ["heroImageUrl","heroImageUrl"],

    ["tripTitle","tripTitle"],
    ["tripPrice","tripPrice"],
    ["tripDifficulty","tripDifficulty"],
    ["tripDuration","tripDuration"],
    ["tripTime","tripTime"],
    ["tripLocation","tripLocation"],
    ["tripDesc","tripDesc"],

    ["step1","step1"],
    ["step2","step2"],
    ["step3","step3"],
    ["step4","step4"],

    ["bookingPhone","bookingPhone"]

  ];

  bindings.forEach(
    ([id,key]) => {

      const element =
        document.getElementById(id);

      if(!element){
        return;
      }

      element.addEventListener(
        "input",
        () => {

          state[key] =
            element.value;

          commit();

        }
      );

    }
  );


  const customTitle =
    document.getElementById(
      "customTitle"
    );

  const customContent =
    document.getElementById(
      "customContent"
    );

  const customImage =
    document.getElementById(
      "customImage"
    );

  const section =
    getSelected();

/* =========================================================
   MEDIA
========================================================= */

function focusMedia(){

  /*
    Media library ـی سادە لە inspector
    دروست دەکەین بۆ Hero و Gallery.
  */

  selectedId =
    selectedId ||
    (
      state.sections[0]
        ? state.sections[0].id
        : null
    );

  const inspector =
    document.getElementById(
      "inspector"
    );

  inspector.innerHTML = `

    <div class="mb-6">

      <div class="text-lg font-black">
        Media Library
      </div>

      <div class="text-xs text-gray-600 mt-2 leading-6">
        وێنەی نوێ Upload بکە یان بەستەری وێنە زیاد بکە.
      </div>

    </div>


    <label
      class="w-full py-4 rounded-2xl border border-dashed border-white/10 bg-white/[.02] flex flex-col items-center justify-center cursor-pointer hover:bg-white/[.04]"
    >

      <i
        data-lucide="upload-cloud"
        class="w-7 h-7 text-gray-500"
      ></i>

      <span
        class="text-xs text-gray-400 mt-3"
      >
        Upload Image
      </span>

      <input
        id="mediaUpload"
        type="file"
        accept="image/*"
        class="hidden"
      >

    </label>


    <div class="divider"></div>


    <div class="field">

      <label>
        زیادکردنی وێنە بە URL
      </label>

      <div class="flex gap-2">

        <input
          id="mediaUrl"
          class="input"
          dir="ltr"
          placeholder="https://..."
        >

        <button
          onclick="addMediaUrl()"
          class="mini-btn"
        >
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>

      </div>

    </div>


    <div
      id="mediaGrid"
      class="grid grid-cols-2 gap-2"
    >

      ${renderMediaGrid()}

    </div>

  `;

  const upload =
    document.getElementById(
      "mediaUpload"
    );

  if(upload){

    upload.addEventListener(
      "change",
      handleImageUpload
    );

  }

  setupIcons();

}


function renderMediaGrid(){

  const images = [
    ...(state.gallery || [])
  ];

  if(state.heroImageUrl){

    images.unshift(
      state.heroImageUrl
    );

  }

  const unique =
    [...new Set(
      images.filter(Boolean)
    )];

  if(!unique.length){

    return `
      <div class="col-span-2 empty">
        هێشتا وێنەیەک نییە.
      </div>
    `;

  }

  return unique.map(
    (src,index) => `

      <div class="media-card">

        <img
          src="${escapeAttr(src)}"
          alt=""
        >

        <button
          class="media-remove"
          onclick="removeMedia('${escapeAttr(src)}')"
        >
          <i
            data-lucide="x"
            class="w-4 h-4"
          ></i>
        </button>

      </div>

    `
  ).join("");

}


function addMediaUrl(){

  const input =
    document.getElementById(
      "mediaUrl"
    );

  const url =
    input.value.trim();

  if(!url){
    return;
  }

  state.gallery.push(
    url
  );

  input.value =
    "";

  commit();

  focusMedia();

}


function handleImageUpload(event){

  const file =
    event.target.files &&
    event.target.files[0];

  if(!file){
    return;
  }

  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showToast(
      "تەنها فایلەکانی وێنە ڕێگەپێدراون."
    );

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    function(){

      state.gallery.push(
        reader.result
      );

      commit();

      focusMedia();

    };

  reader.readAsDataURL(
    file
  );

}


function removeMedia(src){

  state.gallery =
    state.gallery.filter(
      image =>
        (
          typeof image ===
          "string"
            ? image
            : image.url
        ) !== src
    );

  if(
    state.heroImageUrl === src
  ){

    state.heroImageUrl =
      "";

  }

  commit();

  focusMedia();

}

function focusTheme(){

        ڕەنگ و ڕووکاری

      <div class="text-xs text-gray-600 mt-2">

      </div>

    </div>


    <div class="field">

      <label>
        Primary Color
      </label>

      <div class="flex gap-2">

        <input
          id="primaryColor"
          type="color"
          value="${escapeAttr(
            state.gradColor1
          )}"
          class="w-14 h-12 rounded-xl bg-transparent border-0"
        >

        <input
          id="primaryColorText"
          class="input"
          dir="ltr"
          value="${escapeAttr(
            state.gradColor1
          )}"

    </div>


    <div class="field">

      <label>

        <input

            state.gradColor2
          )}"
          class="w-14 h-12 rounded-xl bg-transparent border-0"
        >

        <input
          id="secondaryColorText"
          class="input"
          dir="ltr"
          value="${escapeAttr(
            state.gradColor2
          )}"
        >

      </div>

    </div>


    <div class="divider"></div>


    <div class="field">

      <label>
        SEO Title
      </label>

      <input
        id="seoTitle"
        class="input"
        value="${escapeAttr(
          state.seoTitle || "KURDIA ADVENTURE"
        )}"
      >

    </div>


    <div class="field">

      <label>
        SEO Description
      </label>

      <textarea
        id="seoDescription"
        class="input textarea"
      >${escapeHtml(
        state.seoDescription || ""
      )}</textarea>

    </div>

  `;

  bindThemeEvents();

}


function bindThemeEvents(){

  const pairs = [
    [
      "primaryColor",
      "primaryColorText",
      "gradColor1"
    ],
    [
      "secondaryColor",
      "secondaryColorText",
      "gradColor2"
    ]
  ];

  pairs.forEach(
    ([colorId,textId,key]) => {

      const color =
        document.getElementById(
          colorId
        );

      const text =
        document.getElementById(
          textId
        );

      if(!color || !text){
        return;
      }

      color.addEventListener(
        "input",
        () => {

          state[key] =
            color.value;

          text.value =
            color.value;

          commit();

        }
      );

      text.addEventListener(
        "input",
        () => {

          if(
            /^#[0-9a-f]{6}$/i.test(
              text.value
            )
          ){

            state[key] =
              text.value;

            color.value =
              text.value;

            commit();

          }

        }
      );

    }
  );


  const seoTitle =
    document.getElementById(
      "seoTitle"
    );

  const seoDescription =
    document.getElementById(
      "seoDescription"
    );

  if(seoTitle){

    seoTitle.addEventListener(
      "input",
      () => {

        state.seoTitle =
          seoTitle.value;

        commit();

      }
    );

  }

  if(seoDescription){

    seoDescription.addEventListener(
      "input",
      () => {

        state.seoDescription =
          seoDescription.value;

        commit();

      }
    );

  }

}

/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportJSON(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          state,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    "kurdia-site-state.json";

  a.click();

  URL.revokeObjectURL(
    url
  );

}


function importJSON(){

  const input =
    document.createElement(
      "input"
    );

  input.type =
    "file";

  input.accept =
    ".json,application/json";

  input.onchange =
    event => {

      const file =
        event.target.files[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        () => {

          try{

            const imported =
              JSON.parse(
                reader.result
              );

            state =
              mergeData(
                clone(DEFAULT_DATA),
                imported
              );

            selectedId =
              null;

            initializeHistory();

            saveDraft(false);

            renderAll();

            showToast(
              "✓ داتا هێنرایە ناو Admin."
            );

          }catch(error){

            showToast(
              "❌ JSON هەڵەیە."
            );

          }

        };

      reader.readAsText(
        file
      );

    };

  input.click();

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "z"
    ){

      event.preventDefault();

      if(event.shiftKey){

        redo();

      }else{

        undo();

      }

    }

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      saveDraft();

    }

  }
);


/* =========================================================
   ICONS
========================================================= */

function setupIcons(){

  if(
    window.lucide &&
    typeof lucide.createIcons ===
      "function"
  ){

    lucide.createIcons();

  }

}


/* =========================================================
   INITIALIZATION
========================================================= */

function initializeAdmin(){

  state =
    loadState();

  initializeHistory();

  renderAll();

  setupIcons();

  /*
    ئەگەر iframe state داوای کرد،
    state ـی ئێستا بنێرە.
  */

  window.addEventListener(
    "message",
    event => {

      if(
        event.data &&
        event.data.type ===
        "REQUEST_KURDIA_STATE"
      ){

        if(
          event.source
        ){

          event.source.postMessage(
            {
              type:
                "KURDIA_BUILDER_STATE",
              state:
                clone(state)
            },
            "*"
          );

        }

      }

    }
  );

}


window.addEventListener(

  () => {

    checkLogin();

    setupIcons();

  }
);
