<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="kaBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="kaCrimson" x1="150" y1="120" x2="380" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d62849"/>
      <stop offset="100%" stop-color="#9e1932"/>
    </linearGradient>
    <linearGradient id="kaFrame" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="kaGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#d62849" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- Rounded Dark Navy Shield -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#kaBg)" stroke="url(#kaFrame)" stroke-width="11"/>
  <!-- Crimson Twin Peaks -->
  <path filter="url(#kaGlow)" d="M81 368 L220 174 L282 260 L343 122 L446 368 Z" fill="url(#kaCrimson)"/>
  <!-- Pure White Inner Foreground Peak -->
  <path d="M144 368 L256 241 L308 368 Z" fill="#ffffff"/>
</svg>
