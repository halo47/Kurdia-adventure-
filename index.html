<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KURDIA ADVENTURE</title>

  <meta
    id="metaDescription"
    name="description"
    content="KURDIA ADVENTURE — گەشت و سەرکێشی لە سروشتی کوردستان"
  >

  <meta name="theme-color" content="#0B0F19">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #080b12;
      color: #ffffff;
      font-family: "Vazirmatn", sans-serif;
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(157, 28, 50, .35);
      color: white;
    }

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #080b12;
    }

    ::-webkit-scrollbar-thumb {
      background: #303746;
      border-radius: 50px;
    }

    .glass {
      background: rgba(10, 15, 24, .72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .hero-overlay {
      background:
        linear-gradient(
          to bottom,
          rgba(5,8,14,.15),
          rgba(5,8,14,.55) 45%,
          #080b12 100%
        );
    }

    .hero-gradient {
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(157,28,50,.25),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 35%,
          rgba(255,255,255,.06),
          transparent 25%
        );
    }

    .section-title-line {
      width: 55px;
      height: 3px;
      border-radius: 20px;
    }

    .service-card {
      background: linear-gradient(
        145deg,
        rgba(20,27,40,.96),
        rgba(10,15,24,.96)
      );

      border: 1px solid rgba(255,255,255,.07);

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .service-card:hover {
      transform: translateY(-5px);
      border-color: rgba(157,28,50,.65);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .trip-card {
      background:
        linear-gradient(
          145deg,
          rgba(20,27,40,.98),
          rgba(9,13,21,.98)
        );

      border: 1px solid rgba(255,255,255,.08);

      box-shadow:
        0 25px 70px rgba(0,0,0,.25);
    }

    .btn-primary {
      background: #9d1c32;
      transition: .25s;
    }

    .btn-primary:hover {
      background: #b4223c;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      transition: .25s;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,.12);
      transform: translateY(-2px);
    }

    .info-card {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
    }

    .gallery-image {
      transition:
        transform .5s ease,
        filter .5s ease;
    }

    .gallery-item:hover .gallery-image {
      transform: scale(1.06);
      filter: brightness(1.08);
    }

    .step-number {
      background: #9d1c32;
      box-shadow:
        0 0 0 8px rgba(157,28,50,.10),
        0 10px 35px rgba(157,28,50,.25);
    }

    .assistant-button {
      box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.08);
    }

    .assistant-window {
      box-shadow:
        0 25px 100px rgba(0,0,0,.55);
    }

    .chat-user {
      background: #9d1c32;
      border-radius: 18px 18px 4px 18px;
    }

    .chat-ai {
      background: #171e2b;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 18px 18px 18px 4px;
    }

    .faq-item {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      overflow: hidden;
    }

    .faq-question {
      cursor: pointer;
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }

    .faq-item.open .faq-answer {
      max-height: 300px;
    }

    .faq-item.open .faq-chevron {
      transform: rotate(180deg);
    }

    .faq-chevron {
      transition: .3s;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }

    .custom-image {
      max-height: 500px;
      object-fit: cover;
    }

    @media (max-width: 768px) {

      .hero-height {
        min-height: 760px;
      }

    }

  </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header
  id="navbar"
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
>

  <div class="glass">

    <div
      class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[72px] flex items-center justify-between"
    >

      <!-- LOGO -->

      <a
        href="#home"
        class="flex items-center gap-3"
      >

        <div
          id="logoBox"
          class="w-10 h-10 rounded-xl flex items-center justify-center"
          style="background:#9d1c32"
        >

          <i
            data-lucide="mountain"
            class="w-5 h-5"
          ></i>

        </div>

        <div>

          <div class="font-black tracking-wide">
            KURDIA
          </div>

          <div class="text-[9px] text-gray-400 tracking-[.22em]">
            ADVENTURE
          </div>

        </div>

      </a>


      <!-- DESKTOP NAV -->

      <nav class="hidden md:flex items-center gap-7 text-sm">

        <a
          href="#home"
          class="text-gray-300 hover:text-white transition"
        >
          سەرەتا
        </a>

        <a
          href="#trip"
          class="text-gray-300 hover:text-white transition"
        >
          گەشت
        </a>

        <a
          href="#services"
          class="text-gray-300 hover:text-white transition"
        >
          خزمەتگوزاری
        </a>

        <a
          href="#gallery"
          class="text-gray-300 hover:text-white transition"
        >
          وێنەکان
        </a>

        <a
          href="#booking"
          class="text-gray-300 hover:text-white transition"
        >
          بەشداری
        </a>

      </nav>


      <!-- MOBILE -->

      <button
        id="mobileMenuButton"
        class="md:hidden p-2 rounded-xl bg-white/5"
        onclick="toggleMobileMenu()"
      >

        <i
          data-lucide="menu"
          class="w-5 h-5"
        ></i>

      </button>

    </div>


    <!-- MOBILE NAV -->

    <div
      id="mobileMenu"
      class="hidden md:hidden border-t border-white/5"
    >

      <div class="px-5 py-4 flex flex-col gap-2">

        <a
          href="#home"
          onclick="closeMobileMenu()"
          class="py-3 text-gray-300"
        >
          سەرەتا
        </a>

        <a
          href="#trip"
          onclick="closeMobileMenu()"
          class="py-3 text-gray-300"
        >
          گەشت
        </a>

        <a
          href="#services"
          onclick="closeMobileMenu()"
          class="py-3 text-gray-300"
        >
          خزمەتگوزاری
        </a>

        <a
          href="#gallery"
          onclick="closeMobileMenu()"
          class="py-3 text-gray-300"
        >
          وێنەکان
        </a>

        <a
          href="#booking"
          onclick="closeMobileMenu()"
          class="py-3 text-gray-300"
        >
          بەشداری
        </a>

      </div>

    </div>

  </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main id="siteContent"></main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="border-t border-white/5 bg-[#070a10]">

  <div class="max-w-7xl mx-auto px-5 py-12">

    <div
      class="flex flex-col md:flex-row items-center justify-between gap-6"
    >

      <div class="text-center md:text-right">

        <div class="font-black text-xl">
          KURDIA ADVENTURE
        </div>

        <div class="text-gray-500 text-sm mt-2">
          گەشت • سروشت • هاوڕێتی • یادەوەری
        </div>

      </div>


      <div class="text-gray-600 text-xs text-center">

        KURDIA ADVENTURE ©
        <span id="year"></span>

      </div>

    </div>

  </div>

</footer>


<!-- =========================================================
     AI ASSISTANT
========================================================= -->

<button
  id="assistantButton"
  onclick="toggleAssistant()"
  class="assistant-button fixed bottom-5 left-5 z-[200] w-14 h-14 rounded-2xl flex items-center justify-center"
  style="background:#9d1c32"
>

  <i
    data-lucide="message-circle"
    class="w-6 h-6"
  ></i>

</button>


<div
  id="assistantWindow"
  class="hidden fixed bottom-24 left-5 z-[199] w-[calc(100vw-40px)] sm:w-[390px] max-h-[620px] assistant-window rounded-3xl overflow-hidden bg-[#0d121b] border border-white/10"
>

  <div
    class="px-4 py-4 border-b border-white/10 flex items-center justify-between"
  >

    <div class="flex items-center gap-3">

      <div
        class="w-10 h-10 rounded-xl flex items-center justify-center"
        style="background:#9d1c32"
      >

        <i
          data-lucide="sparkles"
          class="w-5 h-5"
        ></i>

      </div>

      <div>

        <div class="font-bold">
          Kurdia Assistant
        </div>

        <div class="text-[10px] text-green-400">
          Online
        </div>

      </div>

    </div>


    <button
      onclick="toggleAssistant()"
      class="p-2 text-gray-400 hover:text-white"
    >

      <i
        data-lucide="x"
        class="w-5 h-5"
      ></i>

    </button>

  </div>


  <div
    id="chatMessages"
    class="p-4 h-[400px] overflow-y-auto space-y-3"
  ></div>


  <div
    class="p-3 border-t border-white/10"
  >

    <div class="flex gap-2">

      <input
        id="chatInput"
        type="text"
        class="flex-1 bg-[#080d15] border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#9d1c32]"
        placeholder="پرسیارێکت هەیە؟"
        onkeydown="handleChatKey(event)"
      >

      <button
        onclick="sendChatMessage()"
        class="w-12 h-12 rounded-xl flex items-center justify-center"
        style="background:#9d1c32"
      >

        <i
          data-lucide="send"
          class="w-4 h-4"
        ></i>

      </button>

    </div>

  </div>

</div>


<script>

/* ============================================================
   DEFAULT DATA
============================================================ */

const DEFAULT_DATA = {

  gradColor1: "#9d1c32",
  gradColor2: "#111827",

  heroBadge: "KURDIA ADVENTURE",

  heroTitle:
    "گەشتێک بۆ ناو سروشتی کوردستان",

  heroSubtitle:
    "گەشت، سروشت، هاوڕێتی و یادەوەرییەکان لەگەڵ KURDIA ADVENTURE",

  heroImageUrl: "",

  bookingOpen: true,

  tripTitle:
    "گەشتی تایبەتی کوردیا",

  tripPrice:
    "50,000 IQD",

  tripDifficulty:
    "ئاسان",

  tripDuration:
    "1 ڕۆژ",

  tripTime:
    "06:00",

  tripLocation:
    "کوردستان",

  tripDesc:
    "گەشتێکی جوان بۆ ناو سروشت و شوێنە جوانەکانی کوردستان.",

  step1:
    "کۆبوونەوە",

  step2:
    "گەشتکردن",

  step3:
    "چوونە ناو سروشت",

  step4:
    "گەڕانەوە",

  knowledgeAbout:
    "KURDIA ADVENTURE گرووپێکی گەشت و سەرکێشییە کە گەشت بۆ سروشت و شاخەکانی کوردستان ڕێکدەخات.",

  knowledgeEquipment:
    "پاس، خواردن، ئاوی خواردنەوە، چای، نەسکافێ، خێمە، کارەبا و ڕووناکی، کورسی و مێز، ئاگر، یارمەتی فریاکەوتن و ڕێبەر.",

  seoTitle:
    "KURDIA ADVENTURE",

  seoDescription:
    "گەشت و سەرکێشی لە سروشتی کوردستان.",

  socialImage:
    "",

  services: [
    "پاس",
    "نان و خواردن",
    "ئاوی خواردنەوە و چای",
    "خێمە",
    "کارەبا و ڕووناکی",
    "کورسی و مێز",
    "ئەگەر و گەرما",
    "پڕۆژێکتەر",
    "یاری و چالاکی",
    "ڕێبەری شارەزا",
    "یارمەتی فریاکەوتن",
    "کیسی خۆڵ",
    "WC"
  ],

  gallery: [],

  sections: [

    {
      id: "hero_1",
      type: "hero",
      title: "Hero",
      visible: true
    },

    {
      id: "trip_1",
      type: "trip",
      title: "گەشت",
      visible: true
    },

    {
      id: "services_1",
      type: "services",
      title: "خزمەتگوزاری",
      visible: true
    },

    {
      id: "steps_1",
      type: "steps",
      title: "چۆن بەشداری بکەیت؟",
      visible: true
    },

    {
      id: "gallery_1",
      type: "gallery",
      title: "وێنەکان",
      visible: true
    },

    {
      id: "booking_1",
      type: "booking",
      title: "Booking",
      visible: true
    }

  ]

};


/* ============================================================
   STATE
============================================================ */

let siteData = loadPublishedData();


/* ============================================================
   LOAD DATA
============================================================ */

function clone(obj) {

  return JSON.parse(
    JSON.stringify(obj)
  );

}


function mergeData(base, extra) {

  const result = {
    ...base,
    ...extra
  };

  if (!Array.isArray(result.sections)) {
    result.sections =
      clone(DEFAULT_DATA.sections);
  }

  if (!Array.isArray(result.services)) {
    result.services =
      clone(DEFAULT_DATA.services);
  }

  if (!Array.isArray(result.gallery)) {
    result.gallery = [];
  }

  return result;

}


function loadPublishedData() {

  try {

    const published =
      localStorage.getItem(
        "kurdia_builder_published_v3"
      );

    if (published) {

      return mergeData(
        clone(DEFAULT_DATA),
        JSON.parse(published)
      );

    }


    const draft =
      localStorage.getItem(
        "kurdia_builder_draft_v3"
      );

    if (draft) {

      return mergeData(
        clone(DEFAULT_DATA),
        JSON.parse(draft)
      );

    }

  } catch (error) {

    console.error(error);

  }

  return clone(DEFAULT_DATA);

}


/* ============================================================
   RENDER
============================================================ */

function renderSite() {

  document.documentElement.style.setProperty(
    "--primary",
    siteData.gradColor1
  );


  document.body.style.setProperty(
    "--primary",
    siteData.gradColor1
  );


  document
    .getElementById("metaDescription")
    .setAttribute(
      "content",
      siteData.seoDescription || ""
    );


  document.title =
    siteData.seoTitle ||
    "KURDIA ADVENTURE";


  const content =
    document.getElementById(
      "siteContent"
    );


  content.innerHTML = "";


  siteData.sections
    .filter(section => section.visible !== false)
    .forEach(section => {

      const element =
        renderSection(section);

      if (element) {
        content.appendChild(element);
      }

    });


  if (
    !siteData.sections.some(
      s => s.type === "hero" &&
      s.visible !== false
    )
  ) {

    const hero =
      renderHero({
        type: "hero",
        visible: true
      });

    content.prepend(hero);

  }


  setupIcons();

  setupAnimations();

  setupFAQ();

  updateYear();

}


/* ============================================================
   SECTION RENDERER
============================================================ */

function renderSection(section) {

  switch (section.type) {

    case "hero":
      return renderHero(section);

    case "trip":
      return renderTrip(section);

    case "services":
      return renderServices(section);

    case "steps":
      return renderSteps(section);

    case "gallery":
      return renderGallery(section);

    case "faq":
      return renderFAQ(section);

    case "booking":
      return renderBooking(section);

    case "custom":
      return renderCustom(section);

    default:
      return null;

  }

}


/* ============================================================
   HERO
============================================================ */

function renderHero(section) {

  const wrapper =
    document.createElement("section");

  wrapper.id = "home";

  wrapper.className =
    "relative min-h-[760px] md:min-h-[850px] flex items-center overflow-hidden hero-height";


  const image =
    siteData.heroImageUrl ||
    "";


  wrapper.innerHTML = `

    <div
      class="absolute inset-0"
      style="
        background-image:
          ${image
            ? `url('${escapeAttr(image)}')`
            : "linear-gradient(135deg,#111827,#080b12)"
          };
        background-size:cover;
        background-position:center;
      "
    ></div>


    <div class="absolute inset-0 hero-overlay"></div>

    <div class="absolute inset-0 hero-gradient"></div>


    <div class="relative z-10 max-w-7xl mx-auto w-full px-5 sm:px-6 lg:px-8 pt-28">

      <div class="max-w-4xl fade-up">

        <div
          class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 bg-black/20 backdrop-blur-md text-sm text-gray-200"
        >

          <span
            class="w-2 h-2 rounded-full"
            style="background:${escapeAttr(siteData.gradColor1)}"
          ></span>

          ${escapeHTML(siteData.heroBadge)}

        </div>


        <h1
          class="mt-7 text-4xl sm:text-5xl md:text-7xl font-black leading-[1.2] tracking-tight"
        >
          ${escapeHTML(siteData.heroTitle)}
        </h1>


        <p
          class="mt-6 text-base sm:text-lg md:text-xl text-gray-300 max-w-2xl leading-9"
        >
          ${escapeHTML(siteData.heroSubtitle)}
        </p>


        <div class="flex flex-col sm:flex-row gap-3 mt-9">

          <a
            href="#booking"
            class="btn-primary px-7 py-4 rounded-xl font-bold text-center"
          >
            بەشداری لە گەشت
          </a>

          <a
            href="#trip"
            class="btn-secondary px-7 py-4 rounded-xl font-bold text-center"
          >
            زانیاری زیاتر
          </a>

        </div>


        <div
          class="mt-12 grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-3xl"
        >

          ${heroMiniCard(
            "map-pin",
            "شوێن",
            siteData.tripLocation
          )}

          ${heroMiniCard(
            "clock-3",
            "کات",
            siteData.tripTime
          )}

          ${heroMiniCard(
            "calendar-days",
            "ماوە",
            siteData.tripDuration
          )}

          ${heroMiniCard(
            "mountain",
            "ئاست",
            siteData.tripDifficulty
          )}

        </div>

      </div>

    </div>

  `;


  return wrapper;

}


function heroMiniCard(icon, label, value) {

  return `

    <div class="info-card rounded-2xl p-4 backdrop-blur-md">

      <div class="flex items-center gap-2 text-gray-400 text-xs">

        <i
          data-lucide="${icon}"
          class="w-4 h-4"
        ></i>

        ${escapeHTML(label)}

      </div>

      <div class="font-bold mt-2 text-sm">
        ${escapeHTML(value)}
      </div>

    </div>

  `;

}


/* ============================================================
   TRIP
============================================================ */

function renderTrip(section) {

  const wrapper =
    document.createElement("section");

  wrapper.id = "trip";

  wrapper.className =
    "py-24 md:py-32 bg-[#080b12]";


  wrapper.innerHTML = `

    <div class="max-w-7xl mx-auto px-5 sm:px-6 lg:px-8">

      ${sectionHeader(
        "گەشت",
        siteData.tripTitle,
        "هەموو زانیارییە سەرەکییەکانی گەشت لە یەک شوێن."
      )}


      <div class="trip-card rounded-3xl overflow-hidden mt-12">

        <div class="grid lg:grid-cols-2">

          <div class="p-7 sm:p-10 lg:p-14">

            <div class="flex flex-wrap gap-2 mb-6">

              ${pill(
                "map-pin",
                siteData.tripLocation
              )}

              ${pill(
                "clock-3",
                siteData.tripTime
              )}

              ${pill(
                "mountain",
                siteData.tripDifficulty
              )}

            </div>


            <h3
              class="text-3xl md:text-4xl font-black leading-tight"
            >
              ${escapeHTML(siteData.tripTitle)}
            </h3>


            <p
              class="mt-6 text-gray-400 leading-9"
            >
              ${escapeHTML(siteData.tripDesc)}
            </p>


            <div
              class="grid grid-cols-2 gap-3 mt-8"
            >

              ${tripStat(
                "calendar-days",
                "ماوە",
                siteData.tripDuration
              )}

              ${tripStat(
                "clock-3",
                "کات",
                siteData.tripTime
              )}

              ${tripStat(
                "mountain",
                "ئاست",
                siteData.tripDifficulty
              )}

              ${tripStat(
                "map-pin",
                "شوێن",
                siteData.tripLocation
              )}

            </div>


            <div
              class="mt-9 flex flex-col sm:flex-row items-stretch sm:items-center gap-4"

   BOOKING
============================================================ */

function submitBooking(event) {

  event.preventDefault();


  const name =
    document.getElementById(
      "bookingName"
    ).value.trim();


  const phone =
    document.getElementById(
      "bookingPhone"
    ).value.trim();


  const people =
    document.getElementById(
      "bookingPeople"
    ).value;


  const note =
    document.getElementById(
      "bookingNote"
    ).value.trim();


  const result =
    document.getElementById(
      "bookingResult"
    );


  if (!name || !phone) {

    result.className =
      "md:col-span-2 rounded-xl p-4 text-sm bg-red-950/40 border border-red-900/50 text-red-300";

    result.textContent =
      "تکایە ناو و ژمارەی مۆبایل پڕ بکەرەوە.";

    return;

  }


  /*
     ئەم بەشە ئێستا داواکارییەکە لە browser ـەکەدا
     هەڵدەگرێت.
     دەتوانرێت دواتر بە Telegram / API / Database
     پەیوەست بکرێت.
  */

  const booking = {

    name,

    phone,

    people,

    note,

    trip: siteData.tripTitle,

    price: siteData.tripPrice,

    createdAt:
      new Date().toISOString()

  };


  const bookings =
    JSON.parse(
      localStorage.getItem(
        "kurdia_bookings"
      ) || "[]"
    );


  bookings.push(booking);


  localStorage.setItem(
    "kurdia_bookings",
    JSON.stringify(bookings)
  );


  result.className =
    "md:col-span-2 rounded-xl p-4 text-sm bg-green-950/40 border border-green-900/50 text-green-300";


  result.textContent =
    "داواکارییەکەت بە سەرکەوتوویی تۆمار کرا. تیمی KURDIA ADVENTURE پەیوەندیت پێوە دەکات.";


  document
    .getElementById("bookingForm")
    .reset();

}


/* ============================================================
   ASSISTANT
============================================================ */

function toggleAssistant() {

  const windowElement =
    document.getElementById(
      "assistantWindow"
    );


  const isHidden =
    windowElement.classList.contains(
      "hidden"
    );


  windowElement.classList.toggle(
    "hidden"
  );


  if (isHidden) {

    initializeChat();

    setTimeout(() => {

      document
        .getElementById("chatInput")
        ?.focus();

    }, 100);

  }

}


function initializeChat() {

  const messages =
    document.getElementById(
      "chatMessages"
    );


  if (
    messages.dataset.initialized === "1"
  ) {
    return;
  }


  messages.dataset.initialized = "1";


  addChatMessage(
    "ai",
    `سڵاو 👋 من Kurdia Assistant ـم. دەتوانم یارمەتیت بدەم لە زانیاری گەشت، نرخ، شوێن، کات و خزمەتگوزارییەکان.`
  );

}


function addChatMessage(
  type,
  text
) {

  const messages =
    document.getElementById(
      "chatMessages"
    );


  const div =
    document.createElement("div");


  div.className =
    type === "user"
      ? "flex justify-start"
      : "flex justify-end";


  const bubble =
    document.createElement("div");


  bubble.className =
    type === "user"
      ? "chat-user max-w-[85%] px-4 py-3 text-sm leading-7"
      : "chat-ai max-w-[85%] px-4 py-3 text-sm leading-7";


  bubble.textContent = text;


  div.appendChild(bubble);

  messages.appendChild(div);


  messages.scrollTop =
    messages.scrollHeight;

}


function handleChatKey(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendChatMessage();

  }

}


function sendChatMessage() {

  const input =
    document.getElementById(
      "chatInput"
    );


  const message =
    input.value.trim();


  if (!message) {
    return;
  }


  addChatMessage(
    "user",
    message
  );


  input.value = "";


  setTimeout(() => {

    const answer =
      getAssistantAnswer(
        message
      );


    addChatMessage(
      "ai",
      answer
    );

  }, 350);

}


/* ============================================================
   ASSISTANT KNOWLEDGE
============================================================ */

function getAssistantAnswer(message) {

  const m =
    normalizeText(message);


  if (
    containsAny(
      m,
      [
        "سڵاو",
        "slaw",
        "hello",
        "hi"
      ]
    )
  ) {

    return "سڵاو 👋 بەخێربێیت بۆ KURDIA ADVENTURE. چ شتێکت دەوێت بزانیت؟";

  }


  if (
    containsAny(
      m,
      [
        "نرخ",
        "پارە",
        "چەنە",
        "نرخی"
      ]
    )
  ) {

    return `نرخی ئەم گەشتە ${siteData.tripPrice} ـە.`;

  }


  if (
    containsAny(
      m,
      [
        "شوێن",
        "کوێ",
        "location"
      ]
    )
  ) {

    return `شوێنی گەشت: ${siteData.tripLocation}.`;

  }


  if (
    containsAny(
      m,
      [
        "کات",
        "دەست پێ",
        "سەعات"
      ]
    )
  ) {

    return `کاتی گەشت: ${siteData.tripTime}.`;

  }


  if (
    containsAny(
      m,
      [
        "ماوە",
        "چەند ڕۆژ",
        "ڕۆژ"
      ]
    )
  ) {

    return `ماوەی گەشت: ${siteData.tripDuration}.`;

  }


  if (
    containsAny(
      m,
      [
        "خزمەتگوزاری",
        "چی هەیە",
        "دابین"
      ]
    )
  ) {

    return (
      "خزمەتگوزارییەکانمان: " +
      siteData.services.join("، ") +
      "."
    );

  }


  if (
    containsAny(
      m,
      [
        "خێمە",
        "tent"
      ]
    )
  ) {

    return "بەپێی داتای سایت، خێمە بۆ بەشداربووانی تۆمارکراو دابین دەکرێت.";

  }


  if (
    containsAny(
      m,
      [
        "booking",
        "تۆمار",
        "بەشداری",
        "بەشدار"
      ]
    )
  ) {

    if (siteData.bookingOpen) {

      return "بەڵێ، تۆمارکردن کراوەیە. دەتوانیت لە بەشی «بەشداری» فۆڕمەکە پڕ بکەیتەوە.";

    }

    return "لە ئێستادا تۆمارکردن داخراوە.";

  }


  if (
    containsAny(
      m,
      [
        "کوردیا",
        "کێن",
        "دەربارە"
      ]
    )
  ) {

    return (
      siteData.knowledgeAbout ||
      "KURDIA ADVENTURE گرووپێکی گەشت و سەرکێشییە."
    );

  }


  if (
    containsAny(
      m,
      [
        "ئامێر",
        "کەلوپەل",
        "چی بهێنم",
        "ئامادەکاری"
      ]
    )
  ) {

    return (
      siteData.knowledgeEquipment ||
      "بەپێی جۆری گەشت، پێویستە ئامێری گونجاو لەگەڵ خۆت بهێنیت."
    );

  }


  return `ببورە، لە داتای ئێستای سایتدا وەڵامی وردم بۆ ئەم پرسیارە نییە. دەتوانیت لەبارەی نرخ، شوێن، کات، ماوە، خزمەتگوزاری یان بەشداری پرسیار بکەیت.`;

}


/* ============================================================
   TEXT HELPERS
============================================================ */

function normalizeText(text) {

  return String(text || "")
    .toLowerCase()
    .replace(/‌/g, "")
    .trim();

}


function containsAny(
  text,
  list
) {

  return list.some(
    word => text.includes(
      normalizeText(word)
    )
  );

}


/* ============================================================
   FAQ
============================================================ */

function setupFAQ() {

  /*
     Event handlers are inline,
     so no additional setup is required.
  */

}


function toggleFAQ(element) {

  const item =
    element.closest(
      ".faq-item"
    );


  if (!item) {
    return;
  }


  document
    .querySelectorAll(".faq-item")
    .forEach(other => {

      if (other !== item) {

        other.classList.remove(
          "open"
        );

      }

    });


  item.classList.toggle(
    "open"
  );

}


/* ============================================================
   ANIMATIONS
============================================================ */

function setupAnimations() {

  const elements =
    document.querySelectorAll(
      ".fade-up"
    );


  if (
    !("IntersectionObserver" in window)
  ) {

    elements.forEach(
      el => el.classList.add("show")
    );

    return;

  }


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          if (
            entry.isIntersecting
          ) {

            entry.target.classList.add(
              "show"
            );

            observer.unobserve(
              entry.target
            );

          }

        });

      },
      {
        threshold: .12
      }
    );


  elements.forEach(
    el => observer.observe(el)
  );

}

/* ============================================================
   HEX COLOR
============================================================ */

function hexToRgba(
  hex,
  alpha
) {

  let value =
    String(hex || "")
      .replace("#", "")
      .trim();


  if (value.length === 3) {

    value =
      value
        .split("")
        .map(x => x + x)
        .join("");

  }


  const number =
    parseInt(value, 16);


  if (
    Number.isNaN(number)
  ) {

    return `rgba(157,28,50,${alpha})`;

  }


  const r =
    (number >> 16) & 255;

  const g =
    (number >> 8) & 255;

  const b =
    number & 255;


  return `rgba(${r},${g},${b},${alpha})`;

}


/* ============================================================
   ESCAPE
============================================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttr(value) {

  return escapeHTML(value);

}


/* ============================================================
   ADMIN LIVE PREVIEW CONNECTION
============================================================ */

window.addEventListener(
  "message",
  function(event) {

    if (!event.data) {
      return;
    }


    if (
      event.data.type ===
      "KURDIA_BUILDER_STATE"
    ) {

      try {

        siteData =
          mergeData(
            clone(DEFAULT_DATA),
            event.data.state
          );


        renderSite();

      } catch (error) {

        console.error(
          "Preview state error:",
          error
        );

      }

    }

  }
);


/* ============================================================
   ASK ADMIN FOR STATE
============================================================ */

window.parent.postMessage(
  {
    type: "REQUEST_KURDIA_STATE"
  },
  "*"
);


/* ============================================================
   INITIAL RENDER
============================================================ */

renderSite();

setupIcons();

updateYear();
