<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KURDIA ADVENTURE</title>
<meta id="metaDescription" name="description" content="KURDIA ADVENTURE — گەشت، سروشت، هاوڕێتی و سەرکێشی">
<meta name="theme-color" content="#070a10">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
html, body {
  width:100%;
  max-width:100%;
  overflow-x:hidden !important;
  box-sizing:border-box;
}
*, *::before, *::after { box-sizing:border-box; }
img, video, iframe { max-width:100%; }

:root{
 --primary:#9d1c32;
 --primary2:#c92b49;
 --bg:#070a10;
 --surface:#0e141e;
 --surface2:#131c29;
 --text:#fff;
 --muted:#94a3b8;
 --border:rgba(255,255,255,.08);
 --container:1280px;
}

body{
 margin:0;
 background:
 radial-gradient(circle at 10% 5%, rgba(157,28,50,.14), transparent 28%),
 radial-gradient(circle at 90% 35%, rgba(30,64,175,.06), transparent 25%),
 var(--bg);
 color:var(--text);
 font-family:"Vazirmatn",sans-serif;
}

a{ text-decoration:none; color:inherit; }
button, input, textarea, select{ font-family:inherit; }
button{ cursor:pointer; }

.container{
 width:min(var(--container),calc(100% - 40px));
 margin:auto;
}
@media(max-width:640px){
 .container{ width:calc(100% - 24px); }
}

.glass{
 background:rgba(7,10,16,.72);
 backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);
 border-bottom:1px solid var(--border);
}
.surface{
 background:linear-gradient(145deg, rgba(19,28,41,.97), rgba(8,12,19,.99));
 border:1px solid var(--border);
 box-shadow:0 30px 100px rgba(0,0,0,.22);
}
.primary{
 background:linear-gradient(135deg, var(--primary), var(--primary2));
 box-shadow:0 15px 45px rgba(157,28,50,.25);
 transition:.25s ease;
}
.primary:hover{
 transform:translateY(-2px);
 filter:brightness(1.08);
}
.secondary{
 background:rgba(255,255,255,.055);
 border:1px solid rgba(255,255,255,.10);
 backdrop-filter:blur(14px);
 transition:.25s;
}
.secondary:hover{
 background:rgba(255,255,255,.09);
}

.section{ padding:95px 0; }
@media(max-width:768px){ .section{ padding:65px 0; } }

.section-label{ color:#aeb7c5; font-size:.92rem; font-weight:800; }
.section-title{ font-size:clamp(2rem,4vw,3.8rem); line-height:1.2; font-weight:900; letter-spacing:-.04em; }

.site-header{ position:fixed; top:0; left:0; right:0; z-index:1000; }
.header-inner{ height:76px; display:flex; align-items:center; justify-content:space-between; }
.logo{ display:flex; align-items:center; gap:12px; }
.logo-mark{
 width:44px; height:44px; border-radius:16px;
 display:flex; align-items:center; justify-content:center;
 background:linear-gradient(135deg, var(--primary), var(--primary2));
}
.logo-title{ font-weight:900; line-height:1; }
.logo-sub{ font-size:9px; color:#64748b; letter-spacing:.25em; margin-top:5px; }

.desktop-nav{ display:flex; align-items:center; gap:30px; font-size:14px; color:#cbd5e1; }
@media(max-width:1024px){ .desktop-nav{ display:none !important; } }

.hero{ min-height:900px; position:relative; overflow:hidden; display:flex; align-items:center; }
.hero-media{ position:absolute; inset:0; background-position:center; background-size:cover; transform:scale(1.02); }
.hero-gradient{
 position:absolute; inset:0;
 background:linear-gradient(90deg, rgba(0,0,0,.15), rgba(0,0,0,.35) 45%, rgba(0,0,0,.75)),
 linear-gradient(to bottom, rgba(0,0,0,.1), rgba(0,0,0,.3) 40%, rgba(7,10,16,.92) 86%, var(--bg) 100%);
}
.hero-content{ position:relative; z-index:3; padding-top:140px; padding-bottom:90px; }
.hero-badge{
 display:inline-flex; align-items:center; gap:9px; padding:9px 15px;
 border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.30);
 border-radius:999px; backdrop-filter:blur(18px); font-size:13px; font-weight:700;
}
.hero-dot{ width:8px; height:8px; border-radius:50%; background:var(--primary2); }
.hero-title{ max-width:950px; margin-top:28px; font-size:clamp(2.8rem,6.5vw,6.5rem); font-weight:900; line-height:1.05; letter-spacing:-.05em; }
.hero-subtitle{ max-width:680px; margin-top:24px; color:#d1d5db; font-size:clamp(1rem,1.4vw,1.2rem); line-height:2; }
.hero-actions{ margin-top:35px; display:flex; flex-wrap:wrap; gap:12px; }
.hero-action{ padding:15px 24px; border-radius:16px; font-weight:800; text-align:center; }

.trip-card{ overflow:hidden; border-radius:32px; display:grid; grid-template-columns:1.05fr .95fr; }
.trip-photo{ min-height:550px; background-size:cover; background-position:center; position:relative; }
.trip-content{ padding:40px; }
@media(max-width:900px){ .trip-card{ grid-template-columns:1fr; } .trip-photo{ min-height:350px; } .trip-content{ padding:24px; } }

.booking-wrap{
 position:relative; overflow:hidden; border-radius:32px; padding:45px;
 background:linear-gradient(135deg, rgba(157,28,50,.18), rgba(18,26,38,.97) 45%, rgba(7,10,16,.99));
 border:1px solid rgba(157,28,50,.22);
}
@media(max-width:768px){ .booking-wrap{ padding:24px; } }

.booking-grid{ display:grid; grid-template-columns:1fr 1.2fr; gap:40px; align-items:start; }
@media(max-width:950px){ .booking-grid{ grid-template-columns:1fr; gap:25px; } }

.input{
 width:100%; padding:14px 16px; border-radius:15px;
 background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.09);
 color:#fff; outline:none; transition:.25s;
}
.input:focus{ border-color:rgba(201,43,73,.65); box-shadow:0 0 0 4px rgba(157,28,50,.10); }

.extra-person-field{
 padding:10px 14px; background:rgba(255,255,255,.025); border:1px dashed rgba(255,255,255,.1);
 border-radius:14px; margin-top:8px;
}

#toast{
 position:fixed; right:20px; bottom:20px; z-index:5000;
 padding:14px 18px; border-radius:16px; background:#111827;
 border:1px solid rgba(255,255,255,.10); box-shadow:0 20px 60px rgba(0,0,0,.4);
 transform:translateY(100px); opacity:0; transition:.3s;
}
#toast.show{ transform:translateY(0); opacity:1; }

.otp-box{
 display:flex; gap:8px; margin-top:6px;
}
</style>
</head>

<body>

<header class="site-header">
 <div class="glass">
  <div class="container header-inner">
   <a href="#home" class="logo">
    <div class="logo-mark"><i data-lucide="mountain"></i></div>
    <div>
     <div class="logo-title">KURDIA</div>
     <div class="logo-sub">ADVENTURE</div>
    </div>
   </a>
   <nav class="desktop-nav">
    <a href="#home">سەرەتا</a>
    <a href="#trip">گەشت</a>
    <a href="#services">خزمەتگوزاری</a>
    <a href="#booking">بەشداری</a>
   </nav>
   <a href="#booking" class="primary hidden md:flex px-5 py-3 rounded-xl font-bold">بەشداری</a>
  </div>
 </div>
</header>

<main id="app"></main>

<div id="toast"></div>

<script>
const WORKER_ENDPOINT = "https://kurdia.alwandssalh.workers.dev";

const DEFAULT_DATA = {
 gradColor1:"#9d1c32",
 gradColor2:"#c92b49",
 heroBadge:"KURDIA ADVENTURE",
 heroTitle:"لەگەڵ ئێمە سروشت بە شێوەیەکی جیاواز ببینە",
 heroSubtitle:"گەشتەکانمان بۆ ئەو کەسانەیە کە دەیانەوێت سروشت ببینن و هاوڕێی نوێ بدۆزنەوە.",
 heroImageUrl:"",
 tripTitle:"گەشتی نوێی KURDIA",
 tripPrice:"—",
 tripDifficulty:"مامناوەند",
 tripDuration:"١ ڕۆژ",
 tripTime:"بەپێی بەرنامە",
 tripLocation:"کوردستان",
 tripDesc:"زانیاری تەواوی گەشت لێرە دەبینیت.",
 tripImageUrl:"",
 bookingOpen:true,
 services:[
  { name:"پاس و هاتوچۆ", icon:"bus-front" },
  { name:"نان و خواردن", icon:"utensils" },
  { name:"خواردنەوە و چای", icon:"coffee" },
  { name:"تێنت و خێوەت", icon:"tent-tree" }
 ]
};

let siteData = Object.assign({}, DEFAULT_DATA);
let isPhoneVerified = false;

function safeUrl(val){
  const url = String(val || "").trim();
  if(!url) return "";
  if(/^https?:\/\//i.test(url) || url.startsWith("data:image/")) return url;
  return "";
}

function toast(msg){
 const el = document.getElementById("toast");
 el.textContent = msg;
 el.classList.add("show");
 setTimeout(()=> el.classList.remove("show"), 3500);
}

function loadData(){
  try{
    const local = localStorage.getItem("kurdia_builder_published_v3") || localStorage.getItem("KURDIA_BUILDER_STATE");
    if(local) siteData = Object.assign({}, DEFAULT_DATA, JSON.parse(local));
  }catch(e){}
}

function render(){
  document.documentElement.style.setProperty("--primary", siteData.gradColor1 || "#9d1c32");
  document.documentElement.style.setProperty("--primary2", siteData.gradColor2 || "#c92b49");

  const app = document.getElementById("app");
  const heroImg = safeUrl(siteData.heroImageUrl);
  const tripImg = safeUrl(siteData.tripImageUrl || siteData.heroImageUrl);

  app.innerHTML = `
  <section id="home" class="hero">
    <div class="hero-media" style="background-image:url('${heroImg}');"></div>
    <div class="hero-gradient"></div>
    <div class="container hero-content">
      <div class="hero-badge"><span class="hero-dot"></span>${siteData.heroBadge || "KURDIA ADVENTURE"}</div>
      <h1 class="hero-title">${siteData.heroTitle || ""}</h1>
      <p class="hero-subtitle">${siteData.heroSubtitle || ""}</p>
      <div class="hero-actions">
        <a href="#booking" class="primary hero-action">بەشداری لە گەشت</a>
        <a href="#trip" class="secondary hero-action">زانیاری گەشت</a>
      </div>
    </div>
  </section>

  <section id="trip" class="section">
    <div class="container">
      <div class="surface trip-card">
        <div class="trip-photo" style="background-image:url('${tripImg}');"></div>
        <div class="trip-content">
          <div class="section-label">گەشتی داهاتوو</div>
          <h2 class="text-3xl font-black mt-2 mb-4">${siteData.tripTitle}</h2>
          <p class="text-gray-300 leading-relaxed mb-6">${siteData.tripDesc}</p>
          <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="p-3 bg-white/5 rounded-xl border border-white/5"><span class="text-xs text-gray-400">شوێن:</span> <div class="font-bold">${siteData.tripLocation}</div></div>
            <div class="p-3 bg-white/5 rounded-xl border border-white/5"><span class="text-xs text-gray-400">کات:</span> <div class="font-bold">${siteData.tripTime}</div></div>
            <div class="p-3 bg-white/5 rounded-xl border border-white/5"><span class="text-xs text-gray-400">ماوە:</span> <div class="font-bold">${siteData.tripDuration}</div></div>
            <div class="p-3 bg-white/5 rounded-xl border border-white/5"><span class="text-xs text-gray-400">ئاست:</span> <div class="font-bold">${siteData.tripDifficulty}</div></div>
          </div>
          <div class="flex items-center justify-between">
            <div><span class="text-xs text-gray-400">نرخی بەشداری:</span><div class="text-2xl font-black text-rose-500">${siteData.tripPrice}</div></div>
            <a href="#booking" class="primary px-6 py-3 rounded-xl font-bold">بەشداری بکە</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="booking" class="section">
    <div class="container">
      <div class="booking-wrap">
        <div class="booking-grid">
          <div>
            <div class="section-label">بەشداری</div>
            <h2 class="text-3xl sm:text-4xl font-black mt-2">ئامادەیت بۆ گەشتەکەمان؟</h2>
            <p class="text-gray-400 mt-4 leading-relaxed">
              تکایە زانیارییەکانت بە تەواوی تۆمار بکە. سەرەتا ژمارەی مۆبایلی وەتسئەپەکەت دڵنیا بکەرەوە بۆ ئەوەی کۆدی سەلماندنت پێ بگات.
            </p>
          </div>

          <form onsubmit="submitRegistration(event)" class="flex flex-col gap-4">
            <div>
              <label class="block text-xs text-gray-400 mb-1">ناوی سەرپەرشتیاری بەشداربوو</label>
              <input id="regName" class="input" placeholder="ناوی سیانی" required>
            </div>

            <div>
              <label class="block text-xs text-gray-400 mb-1">ژمارەی مۆبایل (WhatsApp)</label>
              <div class="otp-box">
                <input id="regPhone" class="input" placeholder="07500000000" inputmode="tel" required>
                <button type="button" id="sendOtpBtn" onclick="requestOTP()" class="secondary px-4 rounded-xl text-xs font-bold whitespace-nowrap">
                  ناردنی کۆد
                </button>
              </div>
            </div>

            <div id="otpInputRow" class="hidden">
              <label class="block text-xs text-rose-400 mb-1">کۆدی ٤ ژمارەیی وەتسئەپ</label>
              <div class="otp-box">
                <input id="regOtpCode" class="input" placeholder="••••" maxlength="4" inputmode="numeric">
                <button type="button" id="verifyOtpBtn" onclick="verifyOTP()" class="primary px-5 rounded-xl text-xs font-bold">
                  سەلماندن
                </button>
              </div>
            </div>

            <div>
              <label class="block text-xs text-gray-400 mb-1">کۆی ژمارەی کەسەکان</label>
              <select id="regPeople" class="input" onchange="renderExtraNameInputs(this.value)">
                <option value="1">١ کەس (تەنها خۆم)</option>
                <option value="2">٢ کەس</option>
                <option value="3">٣ کەس</option>
                <option value="4">٤ کەس</option>
                <option value="5">٥ کەس</option>
                <option value="6">٦ کەس</option>
              </select>
            </div>

            <div id="extraPersonsContainer"></div>

            <div>
              <label class="block text-xs text-gray-400 mb-1">تێبینی یان داواکاری تایبەت</label>
              <input id="regNote" class="input" placeholder="ئەگەر تێبینیت هەیە لێرە بینوسە...">
            </div>

            <div>
              <label class="block text-xs text-gray-400 mb-1">🧾 بەڵگەی پارەدان (پسوولە)</label>
              <input type="file" id="regReceipt" accept="image/*" class="input" required>
            </div>

            <button type="submit" id="submitRegBtn" class="primary py-4 rounded-xl font-black text-lg mt-2 opacity-50 cursor-not-allowed" disabled>
              🔒 سەرەتا مۆبایلەکەت بسەلمێنە
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>
  `;

  if(window.lucide) lucide.createIcons();
}

function renderExtraNameInputs(count){
  const container = document.getElementById("extraPersonsContainer");
  container.innerHTML = "";
  const num = parseInt(count, 10);
  if(num <= 1) return;

  const title = document.createElement("div");
  title.className = "text-xs font-bold text-gray-300 mt-1 mb-2";
  title.textContent = "ناوی بەشداربووەکانی تر:";
  container.appendChild(title);

  for(let i = 2; i <= num; i++){
    const div = document.createElement("div");
    div.className = "extra-person-field";
    div.innerHTML = `
      <label class="block text-xs text-gray-400 mb-1">ناوی کەسی ${i}</label>
      <input class="input extra-person-input" placeholder="ناوی سیانی کەسی ${i}" required>
    `;
    container.appendChild(div);
  }
}

async function requestOTP(){
  const phone = document.getElementById("regPhone").value.trim();
  const btn = document.getElementById("sendOtpBtn");
  if(!phone){
    toast("تکایە سەرەتا ژمارەی مۆبایل بنووسە");
    return;
  }

  btn.disabled = true;
  btn.textContent = "دەستبەجێ دەنێردرێت...";
  try{
    const res = await fetch(`${WORKER_ENDPOINT}/api/otp/send`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ phone })
    });
    const data = await res.json();
    if(res.ok && data.ok){
      toast("📩 کۆدی دڵنیابوونەوە بۆ وەتسئەپەکەت نێردرا");
      document.getElementById("otpInputRow").classList.remove("hidden");
      btn.textContent = "نێردرایەوە";
    }else{
      toast("❌ " + (data.error || "کێشەیەک ڕوویدا"));
      btn.textContent = "ناردنی کۆد";
    }
  }catch(e){
    toast("کێشە لە پەیوەندی بە سێرڤەر");
    btn.textContent = "ناردنی کۆد";
  }finally{
    btn.disabled = false;
  }
}

async function verifyOTP(){
  const phone = document.getElementById("regPhone").value.trim();
  const code = document.getElementById("regOtpCode").value.trim();
  const btn = document.getElementById("verifyOtpBtn");
  const submitBtn = document.getElementById("submitRegBtn");

  if(!code || code.length !== 4){
    toast("تکایە کۆدی ٤ ژمارەیی بە دروستی بنووسە");
    return;
  }

  btn.disabled = true;
  btn.textContent = "...";
  try{
    const res = await fetch(`${WORKER_ENDPOINT}/api/otp/verify`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ phone, code })
    });
    const data = await res.json();
    if(res.ok && data.verified){
      isPhoneVerified = true;
      toast("✅ ژمارەکەت بە سەرکەوتوویی سەلمێندرا!");
      document.getElementById("otpInputRow").innerHTML = `<div class="text-xs text-green-400 font-bold p-2">✅ ژمارەی مۆبایل بە وەتسئەپ دڵنیاکرایەوە</div>`;
      document.getElementById("regPhone").readOnly = true;
      document.getElementById("sendOtpBtn").style.display = "none";
      submitBtn.disabled = false;
      submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
      submitBtn.textContent = "🚀 ناردنی داواکاری و تۆمارکردن";
    }else{
      toast("❌ " + (data.error || "کۆدەکە هەڵەیە"));
      btn.textContent = "سەلماندن";
    }
  }catch(e){
    toast("کێشە لە پەیوەندی بە سێرڤەر");
    btn.textContent = "سەلماندن";
  }finally{
    btn.disabled = false;
  }
}

async function submitRegistration(e){
  e.preventDefault();
  if(!isPhoneVerified){
    toast("تکایە سەرەتا مۆبایلەکەت بە وەتسئەپ بسەلمێنە");
    return;
  }

  const submitBtn = document.getElementById("submitRegBtn");
  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const people = document.getElementById("regPeople").value;
  const note = document.getElementById("regNote").value.trim();
  const receiptFile = document.getElementById("regReceipt").files?.[0];

  const extraInputs = document.querySelectorAll(".extra-person-input");
  const extraNames = Array.from(extraInputs).map(inp => inp.value.trim()).filter(Boolean).join("، ");

  submitBtn.disabled = true;
  submitBtn.textContent = "تکایە چاوەڕێبە...";
  toast("داواکارییەکەت ڕەوانە دەکرێت...");

  try{
    const form = new FormData();
    form.append("name", name);
    form.append("phone", phone);
    form.append("trip", siteData.tripTitle || "KURDIA ADVENTURE");
    form.append("people", people);
    form.append("extra_names", extraNames);
    form.append("note", note);
    if(receiptFile) form.append("receipt", receiptFile);

    const res = await fetch(`${WORKER_ENDPOINT}/api/register`, { method:"POST", body:form });
    const data = await res.json();

    if(res.ok && data.ok){
      toast("🎉 ناونووسینەکەت بە سەرکەوتوویی تۆمار کرا!");
      e.target.reset();
      isPhoneVerified = false;
      render();
    }else{
      toast("❌ " + (data.error || "کێشەیەک لە تۆمارکردن ڕوویدا"));
      submitBtn.disabled = false;
      submitBtn.textContent = "🚀 ناردنی داواکاری و تۆمارکردن";
    }
  }catch(err){
    toast("کێشەیەک لە پەیوەندی ڕوویدا");
    submitBtn.disabled = false;
    submitBtn.textContent = "🚀 ناردنی داواکاری و تۆمارکردن";
  }
}

window.addEventListener("message", ev => {
  if(ev.data && ev.data.type === "KURDIA_BUILDER_STATE"){
    siteData = Object.assign({}, DEFAULT_DATA, ev.data.state || {});
    render();
  }
});

loadData();
render();
</script>
</body>
</html>
